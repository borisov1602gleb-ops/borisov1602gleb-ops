<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Генератор Юридических Документов</title>
  <meta name="viewport" content="width=1024, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Inter:400,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Lora:400,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --white: #FFFFFF;
      --light: #F8FAFC;
      --black: #111827;
      --box-shadow: 0 10px 40px rgba(0,0,0,0.05);
      --bento-radius: 18px;
      --sidebar-blur: 18px;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--light);
      color: var(--black);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      overflow: hidden;
    }

    .app-layout {
      display: flex;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
    }

    .sidebar {
      position: relative;
      min-width: 340px;
      max-width: 360px;
      background: rgba(248, 250, 252, 0.7);
      backdrop-filter: blur(var(--sidebar-blur));
      box-shadow: var(--box-shadow);
      border-right: 1px solid #eef2f6;
      z-index: 10;
      padding: 32px 0 32px 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .sidebar h2 {
      margin: 0 36px 32px 36px;
      letter-spacing: 0.7px;
      font-weight: 600;
      font-size: 1.2em;
      color: var(--black);
      opacity: 0.86;
    }
    .folder-list {
      flex: 1;
      overflow-y: auto;
      margin: 0 16px;
      padding: 0;
    }

    .accordion-folder {
      margin-bottom: 12px;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 1em;
      color: var(--black);
      padding: 14px 20px;
      border-radius: 13px;
      transition: background 0.13s;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: none;
      outline:none;
    }
    .accordion-folder.active {
      background: var(--white);
      box-shadow: var(--box-shadow);
    }
    .folder-icon {
      font-size: 1.2em;
      opacity: 0.47;
      margin-right: 8px;
    }
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.27s cubic-bezier(.47,1.64,.41,.8);
      background: transparent;
      padding-left: 12px;
    }
    .accordion-content.open {
      max-height: 500px;
      margin: 3px 0 12px 0;
      transition: max-height 0.37s cubic-bezier(.47,1.64,.41,.8);
    }
    .document-btn {
      font: inherit;
      width: 94%;
      display: block;
      background: none;
      border: none;
      color: var(--black);
      padding: 10px 0 10px 38px;
      margin-bottom: 3px;
      text-align: left;
      font-size: 0.96em;
      border-radius: 8px;
      opacity: 0.85;
      cursor: pointer;
      transition: background 0.08s;
    }
    .document-btn:hover, .document-btn.active {
      background: var(--light);
      opacity: 1;
    }

    .editor-area {
      width: 380px;
      background: var(--white);
      border-right: 1px solid #eef2f6;
      box-shadow: var(--box-shadow);
      z-index: 5;
      padding: 36px 38px 38px 38px;
      display: flex;
      flex-direction: column;
      position: relative;
      gap: 24px;
      font-family: 'Inter', sans-serif;
    }

    .fields-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 16px;
    }
    .field-label {
      margin-bottom: 3px;
      font-size: 1em;
      font-weight: 500;
      color: #444;
      letter-spacing: 0.2px;
      opacity: 0.76;
      font-family: 'Inter', sans-serif;
    }
    .field-input, .field-textarea {
      background: transparent;
      border: none;
      outline: none;
      border-bottom: 2px solid #dee1e7;
      font-size: 1.1em;
      font-family: inherit;
      padding: 6px 2px 4px 2px;
      color: var(--black);
      transition: border-color 0.15s;
      resize: none;
      font-weight: 400;
      border-radius: 0;
    }
    .field-input:focus, .field-textarea:focus {
      border-bottom: 2px solid #b4bbc9;
      background: var(--light);
    }
    .signature-block {
      margin-top: 32px;
    }
    .signature-label {
      font-size: 0.95em;
      color: #aaa;
      margin-bottom: 7px;
      opacity: 0.73;
      font-family: 'Inter', sans-serif;
    }
    .signature-pad-wrap {
      width: 100%;
      min-height: 90px;
      background: #F8FAFC;
      border-radius: 16px;
      border: 1.5px solid #eaecf3;
      box-shadow: 0 2px 16px rgba(0,0,0,0.04);
      overflow: hidden;
      position: relative;
      touch-action: none;
    }
    .signature-pad-canvas {
      width: 100%;
      height: 90px;
      display: block;
      cursor: crosshair;
      background: transparent;
    }
    .clear-signature-btn {
      position: absolute;
      right: 12px;
      top: 10px;
      background: rgba(255,255,255,0.9);
      border: 1px solid #ddd;
      border-radius: 7px;
      padding: 2px 13px;
      font-size: 0.93em;
      color: #668;
      cursor: pointer;
      box-shadow: 0 1px 7px rgba(0,0,0,0.04);
      transition: background 0.13s;
      z-index: 11;
    }
    .clear-signature-btn:hover {
      background: #f3f7fa;
    }

    .preview-area {
      flex: 1;
      min-width: 0;
      background: var(--light);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 50px 0 40px 0;
      overflow: auto;
      position: relative;
      z-index: 1;
    }
    .a4-sheet {
      width: 210mm;
      min-width: 210mm;
      height: 297mm;
      background: var(--white);
      margin: 0 auto;
      border-radius: var(--bento-radius);
      box-shadow: var(--box-shadow), 0 1px 8px rgba(17,24,39,0.05);
      padding: 28mm 22mm 26mm 22mm;
      box-sizing: border-box;
      font-family: 'Lora', serif;
      font-size: 1.09em;
      color: #181d21;
      position: relative;
      overflow: visible;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      letter-spacing: 0.01em;
    }

    /* Glassmorphism for sidebar */
    .sidebar:before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: 0 32px 32px 0;
      background: inherit;
      box-shadow: var(--box-shadow);
      pointer-events: none;
    }

    /* Bento Card example (can be reused) */
    .bento-card {
      border-radius: var(--bento-radius);
      background: var(--white);
      box-shadow: var(--box-shadow);
      padding: 20px;
      margin-bottom: 15px;
      transition: box-shadow 0.09s;
    }
    .bento-card:hover {
      box-shadow: 0 15px 50px rgba(0,0,0,0.09);
    }

    /* Hide scrollbars, subtle scroll for sidebar/folders */
    .folder-list, .editor-area, .preview-area {
      scrollbar-width: thin;
      scrollbar-color: #eaeaea #f6f8fb;
    }
    .folder-list::-webkit-scrollbar,
    .editor-area::-webkit-scrollbar,
    .preview-area::-webkit-scrollbar {
      height: 7px;
      width: 7px;
      background: #f6f8fb;
    }
    .folder-list::-webkit-scrollbar-thumb,
    .editor-area::-webkit-scrollbar-thumb,
    .preview-area::-webkit-scrollbar-thumb {
      background: #eaeaea;
      border-radius: 8px;
    }

    /* Welcome splash screen at start */
    .welcome-splash {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.94);
      z-index: 1100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Inter', sans-serif;
      color: var(--black);
      transition: opacity 0.33s;
      opacity: 1;
      pointer-events: all;
    }
    .welcome-splash.hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s 0.18s;
    }
    .welcome-title {
      font-size: 2.4em;
      font-weight: 700;
      margin-bottom: 15px;
      letter-spacing: 1.5px;
      color: var(--black);
      opacity: 0.93;
    }
    .welcome-desc {
      font-size: 1.13em;
      max-width: 470px;
      margin: 0 auto 33px auto;
      color: #222;
      opacity: 0.67;
    }
    .welcome-btn {
      font-family: "Inter", sans-serif;
      font-size: 1.09em;
      padding: 11px 34px 10px 34px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #111827 81%, #F8FAFC 100%);
      color: #fff;
      font-weight: 600;
      box-shadow: var(--box-shadow);
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.18s;
      outline: none;
    }
    .welcome-btn:active {
      background: #323242;
    }

    /* --- Print styles --- */
    @media print {
      html, body, .app-layout, .sidebar, .editor-area, .welcome-splash, .bento-card, .clear-signature-btn {
        display: none !important;
      }
      .a4-sheet {
        background: #fff !important;
        width: 210mm !important;
        min-width: 0 !important;
        height: 297mm !important;
        padding: 28mm 22mm 26mm 22mm !important;
        margin: 0 !important;
        border: none !important;
        box-shadow: none !important;
        font-size: 1.09em !important;
        display: block !important;
        position: static !important;
        color: #181d21 !important;
        overflow: visible !important;
      }
      .preview-area {
        display: block !important;
        padding: 0 !important;
        background: transparent !important;
      }
    }
  </style>
</head>
<body>
  <div class="welcome-splash" id="welcomeSplash">
    <div class="bento-card" style="min-width:280px; max-width:400px; margin:auto;">
      <div class="welcome-title">Генератор Юридических Документов</div>
      <div class="welcome-desc">Создавайте документы легко: выбирайте шаблоны, заполняйте данные, подписывайте онлайн и печатайте готовые PDF. Пространственный минимализм и мгновенный живой предпросмотр.</div>
      <button class="welcome-btn" id="startAppBtn">Начать работу</button>
    </div>
  </div>
  <div class="app-layout" id="appLayout" style="filter: blur(0px);">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>Папки документов</h2>
      <nav class="folder-list" id="folderList"></nav>
    </aside>
    <!-- Editor -->
    <section class="editor-area">
      <div class="fields-group" id="editorFields"></div>
      <div class="signature-block">
        <div class="signature-label">Подпись:</div>
        <div class="signature-pad-wrap" id="signaturePadWrap">
          <canvas id="signaturePad" class="signature-pad-canvas"></canvas>
          <button class="clear-signature-btn" id="clearSignatureBtn" type="button">Очистить</button>
        </div>
      </div>
    </section>
    <!-- Preview -->
    <section class="preview-area">
      <div class="a4-sheet" id="a4Preview"></div>
    </section>
  </div>
  <script>
    // --- Database structure (folders, documents, fields, templates) ---
    const database = {
      'Договоры': {
        icon: '📂',
        documents: [
          {
            id: "dogovor_arendy",
            name: "Договор аренды",
            fields: [
              { name: 'arendodatel', label: 'Арендодатель', type: 'text', placeholder: 'ФИО, организация' },
              { name: 'arendator', label: 'Арендатор', type: 'text', placeholder: 'ФИО, организация' },
              { name: 'object', label: 'Объект аренды', type: 'textarea', placeholder: 'Описание объекта' },
              { name: 'summa', label: 'Сумма', type: 'text', placeholder: 'Например: 100 000 руб.' },
              { name: 'date', label: 'Дата', type: 'date', placeholder: 'Дата заключения' },
            ],
            template: (v, signatureDataUrl) => `
              <div style="text-align:center; margin-bottom:28px; font-size:1.28em; font-weight:700;">
                ДОГОВОР АРЕНДЫ
              </div>
              <div style="margin-bottom:18px;text-align:right;color:#535454; font-size:0.99em;">
                ${v.date || '____.__.____'}
              </div>
              <div>Арендодатель: <b>${v.arendodatel || '_______________'}</b></div>
              <div>Арендатор: <b>${v.arendator || '_______________'}</b></div>
              <div style="margin-top:13px;">Объект аренды: <span>${v.object || '_____________________'}</span></div>
              <div style="margin-top:11px;">Сумма аренды: <b>${v.summa || '___________'}</b></div>

              <div style="margin-top:40px;"></div>
              <div style="display:flex;justify-content:space-between;align-items:end;">
                <div>
                  <div>Арендодатель</div>
                  <div style="margin:22px 0;">
                    ${signatureDataUrl ? `<img src="${signatureDataUrl}" alt="Подпись" style="height:38px;border-bottom:1px solid #ccc;opacity:0.96;">` : '<span style="display:inline-block;width:130px;height:32px;border-bottom:1px solid #bbb;opacity:0.37;"></span>'}
                  </div>
                  <div style="font-size:0.93em; color:#757575">${v.arendodatel || '&mdash;'}</div>
                </div>
                <div>
                  <div>Арендатор</div>
                  <div style="margin:22px 0;">
                    <span style="display:inline-block;width:130px;height:32px;border-bottom:1px solid #bbb;opacity:0.37;"></span>
                  </div>
                  <div style="font-size:0.93em; color:#757575">${v.arendator || '&mdash;'}</div>
                </div>
              </div>
            `
          },
          {
            id: "dogovor_uslug",
            name: "Договор оказания услуг",
            fields: [
              { name: 'zakazchik', label: 'Заказчик', type: 'text', placeholder: 'ФИО, организация' },
              { name: 'ispolnitel', label: 'Исполнитель', type: 'text', placeholder: 'ФИО, организация' },
              { name: 'usluga', label: 'Услуга', type: 'textarea', placeholder: 'Описание услуги' },
              { name: 'stoimost', label: 'Стоимость', type: 'text', placeholder: 'Пример: 36 000 руб.' },
              { name: 'date', label: 'Дата', type: 'date', placeholder: 'Дата заключения' },
            ],
            template: (v, signatureDataUrl) => `
              <div style="text-align:center; margin-bottom:26px; font-size:1.28em; font-weight:700;">
                ДОГОВОР ОКАЗАНИЯ УСЛУГ
              </div>
              <div style="margin-bottom:17px;text-align:right; color:#535454; font-size:0.99em;">
                ${v.date || '____.__.____'}
              </div>
              <div>Заказчик: <b>${v.zakazchik || '_______________'}</b></div>
              <div>Исполнитель: <b>${v.ispolnitel || '_______________'}</b></div>
              <div style="margin-top:13px;">Услуга: <span>${v.usluga || '_____________________'}</span></div>
              <div style="margin-top:11px;">Стоимость: <b>${v.stoimost || '___________'}</b></div>
              <div style="margin-top:40px;"></div>
              <div style="display:flex;justify-content:space-between;align-items:end;">
                <div>
                  <div>Заказчик</div>
                  <div style="margin:22px 0;">
                    ${signatureDataUrl ? `<img src="${signatureDataUrl}" alt="Подпись" style="height:38px;border-bottom:1px solid #ccc;opacity:0.97;">` : '<span style="display:inline-block;width:130px;height:32px;border-bottom:1px solid #bbb;opacity:0.37;"></span>'}
                  </div>
                  <div style="font-size:0.93em; color:#757575">${v.zakazchik || '&mdash;'}</div>
                </div>
                <div>
                  <div>Исполнитель</div>
                  <div style="margin:22px 0;">
                    <span style="display:inline-block;width:130px;height:32px;border-bottom:1px solid #bbb;opacity:0.37;"></span>
                  </div>
                  <div style="font-size:0.93em; color:#757575">${v.ispolnitel || '&mdash;'}</div>
                </div>
              </div>
            `
          }
        ]
      },
      'Расписки': {
        icon: '📝',
        documents: [
          {
            id: "raspiska_obych",
            name: "Денежная расписка",
            fields: [
              { name: 'fio', label: 'ФИО', type: 'text', placeholder: 'Фамилия Имя Отчество' },
              { name: 'summa', label: 'Сумма', type: 'text', placeholder: 'Сумма цифрами и прописью' },
              { name: 'naznachenie', label: 'Назначение', type: 'textarea', placeholder: 'Назначение (например: заём)' },
              { name: 'date', label: 'Дата', type: 'date', placeholder: 'Дата подписания' },
            ],
            template: (v, signatureDataUrl) => `
              <div style="text-align:center; margin-bottom:22px; font-size:1.25em; font-weight:700;">
                РАСПИСКА
              </div>
              <div style="margin-bottom:16px; color:#535454; text-align:right; font-size: 1em;">${v.date || '____.__.____'}</div>
              <div>Я, <b>${v.fio || '___________________'}</b>, получил(а)/передал(а) сумму: <b>${v.summa || '_____________'}</b></div>
              <div style="margin-top:13px;">
                Назначение: <span>${v.naznachenie || '_____________'}</span>
              </div>
              <div style="margin-top:45px;"></div>
              <div style="display:flex;justify-content:flex-start;align-items:end;">
                <div>
                  <div>Подпись:</div>
                  <div style="margin:18px 0;">
                    ${signatureDataUrl ? `<img src="${signatureDataUrl}" alt="Подпись" style="height:36px;border-bottom:1px solid #ccc;">` : '<span style="display:inline-block;width:130px;height:32px;border-bottom:1px solid #bbb;opacity:0.41;"></span>'}
                  </div>
                  <div style="font-size:0.93em; color:#757575">${v.fio || '&mdash;'}</div>
                </div>
              </div>
            `
          }
        ]
      }
    };

    // --- Global State ---
    let selectedFolder = null;
    let selectedDocument = null;
    let fieldValues = {};
    let signatureDataUrl = null;

    // --- DOM Nodes ---
    const folderList = document.getElementById('folderList');
    const editorFields = document.getElementById('editorFields');
    const a4Preview = document.getElementById('a4Preview');
    const signaturePad = document.getElementById('signaturePad');
    const signaturePadWrap = document.getElementById('signaturePadWrap');
    const clearSignatureBtn = document.getElementById('clearSignatureBtn');
    const welcomeSplash = document.getElementById('welcomeSplash');
    const startAppBtn = document.getElementById('startAppBtn');

    // --- Render Folders/Sidebar ---
    function renderSidebar() {
      folderList.innerHTML = '';
      Object.entries(database).forEach(([folderName, folderObj], folderIdx) => {
        const folderId = 'folder-' + folderName.replace(/\s+/g, '_');
        const isActive = (selectedFolder === folderName);
        const documents = folderObj.documents;

        // Folder Accordion Button
        const folderBtn = document.createElement('button');
        folderBtn.className = 'accordion-folder' + (isActive ? ' active' : '');
        folderBtn.type = 'button';
        folderBtn.setAttribute('aria-expanded', isActive ? 'true' : 'false');
        folderBtn.innerHTML = `<span class="folder-icon">${folderObj.icon || '📁'}</span> ${folderName}<span style="margin-left:auto;opacity:0.29;font-size:0.93em;">${isActive ? '▲' : '▼'}</span>`;

        // Accordion Content (documents)
        const docWrap = document.createElement('div');
        docWrap.className = 'accordion-content' + (isActive ? ' open' : '');
        documents.forEach(doc => {
          const docBtn = document.createElement('button');
          docBtn.className = 'document-btn' + (selectedDocument && selectedDocument.id === doc.id ? ' active' : '');
          docBtn.textContent = doc.name;
          docBtn.type = 'button';
          docBtn.onclick = () => {
            selectedFolder = folderName;
            selectedDocument = doc;
            // Reset fields and signature when selecting another document
            fieldValues = {};
            signatureDataUrl = null;
            renderSidebar();
            renderEditor();
            renderPreview();
          };
          docWrap.appendChild(docBtn);
        });

        // Folder accordion expand/collapse
        folderBtn.onclick = () => {
          if (selectedFolder === folderName) {
            selectedFolder = null;
            selectedDocument = null;
            fieldValues = {};
            signatureDataUrl = null;
            renderSidebar();
            renderEditor();
            renderPreview();
          } else {
            selectedFolder = folderName;
            selectedDocument = null;
            fieldValues = {};
            signatureDataUrl = null;
            renderSidebar();
            renderEditor();
            renderPreview();
          }
        };

        folderList.append(folderBtn);
        folderList.append(docWrap);
      });
    }

    // --- Render Editor Fields ---
    function renderEditor() {
      editorFields.innerHTML = '';
      if (!selectedDocument) {
        editorFields.innerHTML = `<div style="opacity:0.47; margin:52px auto; max-width:220px; text-align:center;">Выберите документ, чтобы начать редактирование</div>`;
        signaturePadWrap.style.opacity = '0.13';
        signaturePadWrap.style.pointerEvents = 'none';
        return;
      }
      signaturePadWrap.style.opacity = '';
      signaturePadWrap.style.pointerEvents = '';
      selectedDocument.fields.forEach(field => {
        const wrap = document.createElement('div');
        const id = 'field_' + field.name;
        wrap.innerHTML = `
          <label class="field-label" for="${id}">${field.label}:</label>
        `;
        let input;
        if (field.type === 'textarea') {
          input = document.createElement('textarea');
          input.className = 'field-textarea';
          input.rows = 3;
        } else {
          input = document.createElement('input');
          input.className = 'field-input';
          input.type = (field.type === 'date' ? 'date' : 'text');
        }
        input.id = id;
        input.name = field.name;
        input.placeholder = field.placeholder || '';
        input.value = fieldValues[field.name] || '';
        input.oninput = (e) => {
          fieldValues[field.name] = input.value;
          renderPreview();
        };
        wrap.appendChild(input);
        editorFields.appendChild(wrap);
      });
    }
    // --- Signature Pad Logic ---
    let isDrawing = false, lastX = 0, lastY = 0;
    signaturePad.width = signaturePadWrap.offsetWidth;
    signaturePad.height = 90;
    const ctx = signaturePad.getContext('2d');
    ctx.lineWidth = 2.3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#111827';

    function clearPad() {
      ctx.clearRect(0, 0, signaturePad.width, signaturePad.height);
      signatureDataUrl = null;
      renderPreview();
    }
    function beginDraw(x, y) {
      isDrawing = true;
      lastX = x;
      lastY = y;
      ctx.beginPath();
      ctx.moveTo(x, y);
    }
    function draw(x, y) {
      if (!isDrawing) return;
      ctx.lineTo(x, y);
      ctx.stroke();
      lastX = x;
      lastY = y;
    }
    function endDraw() {
      isDrawing = false;
      // Save DataURL only if there is ink!
      const blank = document.createElement('canvas');
      blank.width = signaturePad.width;
      blank.height = signaturePad.height;
      if (signaturePad.toDataURL() !== blank.toDataURL()) {
        signatureDataUrl = signaturePad.toDataURL('image/png');
      } else {
        signatureDataUrl = null;
      }
      renderPreview();
    }

    // Mouse events
    signaturePad.addEventListener('mousedown', e => {
      const rect = signaturePad.getBoundingClientRect();
      beginDraw(e.clientX - rect.left, e.clientY - rect.top);
    });
    signaturePad.addEventListener('mousemove', e => {
      if (!isDrawing) return;
      const rect = signaturePad.getBoundingClientRect();
      draw(e.clientX - rect.left, e.clientY - rect.top);
    });
    signaturePad.addEventListener('mouseup', endDraw);
    signaturePad.addEventListener('mouseleave', endDraw);
    // Touch events
    signaturePad.addEventListener('touchstart', function (e) {
      let t = e.touches[0];
      const rect = signaturePad.getBoundingClientRect();
      beginDraw(t.clientX - rect.left, t.clientY - rect.top);
      e.preventDefault();
    });
    signaturePad.addEventListener('touchmove', function (e) {
      if (!isDrawing) return;
      let t = e.touches[0];
      const rect = signaturePad.getBoundingClientRect();
      draw(t.clientX - rect.left, t.clientY - rect.top);
      e.preventDefault();
    });
    signaturePad.addEventListener('touchend', endDraw);
    clearSignatureBtn.onclick = clearPad;

    // Resize signaturePad responsively
    window.addEventListener('resize', () => {
      const image = signaturePad.toDataURL();
      signaturePad.width = signaturePadWrap.offsetWidth;
      signaturePad.height = 90;
      ctx.lineWidth = 2.3;
      if (signatureDataUrl) {
        let img = new window.Image();
        img.onload = () => ctx.drawImage(img, 0, 0, signaturePad.width, signaturePad.height);
        img.src = image;
      }
    });

    // --- Render A4 Preview ---
    function renderPreview() {
      if (selectedDocument) {
        a4Preview.innerHTML = selectedDocument.template(fieldValues, signatureDataUrl);
      } else {
        a4Preview.innerHTML = `<div style="color:#aaa;opacity:0.23;margin-top:100px;text-align:center;font-size:1.22em;">
          ⬅️ Выберите шаблон документа из папки<br>👇 Заполните данные<br>✍️ Подпишите ниже &mdash; готово!
        </div>`;
      }
    }

    // --- Setup welcome page & logic ---
    startAppBtn.onclick = () => {
      welcomeSplash.classList.add('hidden');
      setTimeout(() => welcomeSplash.style.display = 'none', 390);
      document.body.style.overflow = 'hidden';
    };
    window.onload = () => {
      renderSidebar();
      renderEditor();
      renderPreview();
    };

    // --- Accessibility: ESC hides splash, focus trap for first input
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape' && !welcomeSplash.classList.contains('hidden')) {
        startAppBtn.click();
      }
    });
    // Focus first input on doc select
    const observer = new MutationObserver(() => {
      // When new fields rendered, focus first input
      const first = editorFields.querySelector('input,textarea');
      if (first) first.focus();
    });
    observer.observe(editorFields, { childList: true });

  </script>
</body>
</html>
