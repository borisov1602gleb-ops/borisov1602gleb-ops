<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMB — Legal Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    /* ========== DESIGN TOKENS (Spatial 2026) ========== */
    :root {
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;
      --sidebar-w: 320px;
      --editor-w: 450px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --blur-glass: 40px;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.12);
      --bg-base: #0d0e12;
      --bg-elevated: #14161c;
      --text-primary: #e8eaef;
      --text-secondary: #9ca3b4;
      --accent: #7c8aff;
      --accent-hover: #9aa8ff;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --font-ui: 'Inter', -apple-system, sans-serif;
      --font-doc: 'Lora', Georgia, serif;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --dur-fast: 150ms;
      --dur-normal: 250ms;
      --dur-slow: 400ms;
    }

    /* ========== RESET & BASE ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--font-ui);
      font-weight: 400;
      color: var(--text-primary);
      background: var(--bg-base);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, textarea, select { font-family: inherit; }

    /* ========== LAYOUT: THREE COLUMNS ========== */
    .app {
      display: flex;
      min-height: 100vh;
    }

    /* ========== SIDEBAR (Glassmorphism) ========== */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      height: 100vh;
      position: sticky;
      top: 0;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur-glass));
      -webkit-backdrop-filter: blur(var(--blur-glass));
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      transition: box-shadow var(--dur-normal) var(--ease-out),
                  border-color var(--dur-normal) var(--ease-out);
    }
    .sidebar:hover {
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.2);
      border-color: rgba(255, 255, 255, 0.18);
    }
    .sidebar-header {
      padding: var(--space-lg);
      border-bottom: 1px solid var(--glass-border);
      font-weight: 700;
      font-size: 1.125rem;
      letter-spacing: -0.02em;
    }
    .sidebar-tree {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-md);
    }
    .folder {
      margin-bottom: var(--space-sm);
    }
    .folder-header {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--text-secondary);
      transition: background var(--dur-fast), color var(--dur-fast);
    }
    .folder-header:hover { background: var(--glass-bg); color: var(--text-primary); }
    .folder-header[aria-expanded="true"] { color: var(--accent); }
    .folder-icon { transition: transform var(--dur-normal) var(--ease-out); }
    .folder[aria-expanded="true"] .folder-icon { transform: rotate(90deg); }
    .folder-children {
      overflow: hidden;
      padding-left: var(--space-lg);
    }
    .folder-children[hidden] { display: none; }
    .doc-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      margin: 2px 0;
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      color: var(--text-secondary);
      transition: background var(--dur-fast), color var(--dur-fast);
    }
    .doc-item:hover { background: var(--glass-bg); color: var(--text-primary); }
    .doc-item.active { background: rgba(124, 138, 255, 0.15); color: var(--accent); }
    .doc-item .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .doc-item .status-dot.new { background: var(--success); }
    .doc-item .status-dot.draft { background: var(--warning); }
    .doc-item .status-dot.final { background: var(--accent); }

    /* ========== EDITOR COLUMN ========== */
    .editor-column {
      width: var(--editor-w);
      min-width: var(--editor-w);
      background: var(--bg-elevated);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
    }
    .editor-toolbar {
      padding: var(--space-md) var(--space-lg);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }
    .editor-form {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-lg);
    }
    .form-group {
      margin-bottom: var(--space-lg);
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: var(--space-sm);
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
      font-size: 0.875rem;
      transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 138, 255, 0.2);
    }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-group.error input,
    .form-group.error textarea { border-color: var(--danger); }

    /* ========== UI KIT: BUTTONS ========== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 600;
      transition: background var(--dur-fast), transform var(--dur-fast), box-shadow var(--dur-fast);
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 12px rgba(124, 138, 255, 0.4); }
    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
    }
    .btn-ghost:hover { background: var(--glass-bg); color: var(--text-primary); }

    /* ========== UI KIT: TOOLTIPS ========== */
    [data-tooltip] {
      position: relative;
    }
    [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      padding: var(--space-xs) var(--space-sm);
      background: var(--bg-elevated);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      color: var(--text-secondary);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--dur-fast), transform var(--dur-fast);
    }
    [data-tooltip]:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    /* ========== UI KIT: CHECKBOXES ========== */
    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }
    .checkbox-wrap:hover { color: var(--text-primary); }
    .checkbox-custom {
      width: 18px;
      height: 18px;
      border: 2px solid var(--glass-border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color var(--dur-fast), background var(--dur-fast);
    }
    .checkbox-wrap input { display: none; }
    .checkbox-wrap input:checked + .checkbox-custom {
      background: var(--accent);
      border-color: var(--accent);
    }
    .checkbox-wrap input:checked + .checkbox-custom::after {
      content: '';
      width: 5px;
      height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-bottom: 2px;
    }

    /* ========== UI KIT: PROGRESS BAR ========== */
    .progress-bar {
      height: 6px;
      background: var(--glass-bg);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-hover));
      border-radius: 3px;
      transition: width var(--dur-slow) var(--ease-out);
    }

    /* ========== PREVIEW COLUMN (A4) ========== */
    .preview-column {
      flex: 1;
      min-width: 0;
      padding: var(--space-xl);
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #1a1b22;
    }
    .a4-wrapper {
      width: 210mm;
      min-height: 297mm;
      background: #fff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border-radius: 2px;
      overflow: hidden;
      transform-origin: top center;
    }
    .a4-inner {
      padding: 20mm 25mm;
      font-family: var(--font-doc);
      font-size: 11pt;
      line-height: 1.5;
      color: #1a1a1a;
    }
    .a4-inner h1 {
      font-size: 14pt;
      font-weight: 700;
      text-align: center;
      margin-bottom: 1.5em;
    }
    .a4-inner .doc-field {
      margin-bottom: 0.75em;
    }
    .a4-inner .doc-field strong { font-weight: 600; }
    .a4-inner .signature-zone {
      margin-top: 2em;
      display: flex;
      gap: 3em;
      flex-wrap: wrap;
    }
    .a4-inner .signature-block {
      min-width: 120px;
    }
    .a4-inner .signature-block canvas {
      display: block;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    /* ========== MODAL (Glassmorphism) ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity var(--dur-normal), visibility var(--dur-normal);
    }
    .modal-overlay.visible {
      opacity: 1;
      visibility: visible;
    }
    .modal {
      width: 90%;
      max-width: 480px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur-glass));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      transform: scale(0.95);
      transition: transform var(--dur-normal) var(--ease-out);
    }
    .modal-overlay.visible .modal { transform: scale(1); }
    .modal h2 { margin-bottom: var(--space-lg); font-size: 1.25rem; }

    /* ========== SIGNATURE PAD ========== */
    .signature-pad-container {
      margin: var(--space-md) 0;
    }
    .signature-pad {
      display: block;
      width: 100%;
      height: 160px;
      background: #fff;
      border: 2px solid var(--glass-border);
      border-radius: var(--radius-md);
      cursor: crosshair;
      touch-action: none;
    }

    /* ========== MICRO-INTERACTIONS ========== */
    .doc-item, .folder-header, .btn, .form-group input, .form-group textarea {
      transition-duration: var(--dur-fast);
      transition-timing-function: var(--ease-out);
    }

    /* ========== ANIMATIONS (Micro-interactions) ========== */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .doc-item { animation: fadeIn var(--dur-normal) var(--ease-out); }
    .form-group { animation: slideUp var(--dur-slow) var(--ease-out) backwards; }
    .form-group:nth-child(1) { animation-delay: 0ms; }
    .form-group:nth-child(2) { animation-delay: 30ms; }
    .form-group:nth-child(3) { animation-delay: 60ms; }
    .form-group:nth-child(4) { animation-delay: 90ms; }
    .form-group:nth-child(5) { animation-delay: 120ms; }
    .form-group:nth-child(6) { animation-delay: 150ms; }
    .form-group:nth-child(7) { animation-delay: 180ms; }
    .form-group:nth-child(8) { animation-delay: 210ms; }
    .form-group:nth-child(9) { animation-delay: 240ms; }
    .form-group:nth-child(10) { animation-delay: 270ms; }
    .form-group:nth-child(11) { animation-delay: 300ms; }
    .form-group:nth-child(12) { animation-delay: 330ms; }
    .form-group:nth-child(13) { animation-delay: 360ms; }
    .form-group:nth-child(14) { animation-delay: 390ms; }
    .form-group:nth-child(15) { animation-delay: 420ms; }
    .btn:focus-visible, .doc-item:focus-visible, .folder-header:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ========== SCROLLBAR (Neo-Minimal) ========== */
    .sidebar-tree::-webkit-scrollbar,
    .editor-form::-webkit-scrollbar,
    .preview-column::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .sidebar-tree::-webkit-scrollbar-track,
    .editor-form::-webkit-scrollbar-track,
    .preview-column::-webkit-scrollbar-track {
      background: transparent;
    }
    .sidebar-tree::-webkit-scrollbar-thumb,
    .editor-form::-webkit-scrollbar-thumb,
    .preview-column::-webkit-scrollbar-thumb {
      background: var(--glass-border);
      border-radius: 4px;
    }
    .sidebar-tree::-webkit-scrollbar-thumb:hover,
    .editor-form::-webkit-scrollbar-thumb:hover,
    .preview-column::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* ========== A4 PREVIEW TYPOGRAPHY (Lora document style) ========== */
    .a4-inner p { margin-bottom: 1em; text-align: justify; }
    .a4-inner .clause { margin-left: 1.5em; margin-bottom: 0.5em; }
    .a4-inner .signature-line { border-bottom: 1px solid #333; min-width: 200px; display: inline-block; margin-top: 40px; }
    .a4-inner .stamp-placeholder { width: 120px; height: 120px; border: 1px dashed #999; display: inline-block; vertical-align: top; }

    /* ========== EMPTY & LOADING STATES ========== */
    .preview-column.is-empty .a4-wrapper { opacity: 0.5; pointer-events: none; }
    .editor-form.is-empty { display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 0.875rem; }
    .sidebar-tree:empty::after { content: 'Нет документов'; display: block; padding: var(--space-lg); color: var(--text-secondary); font-size: 0.875rem; }

    /* Document-type specific A4 accents (optional use via data-doc-type on .a4-inner) */
    .a4-inner[data-doc-type="contract"] h1 { border-bottom: 2px solid #333; padding-bottom: 0.25em; }
    .a4-inner[data-doc-type="act"] h1 { font-size: 13pt; }
    .a4-inner[data-doc-type="resolution"] .clause { margin-left: 2em; }

    /* ========== PRINT (Export Engine) ========== */
    @media print {
      body * { visibility: hidden; }
      .preview-column, .preview-column * { visibility: visible; }
      .preview-column {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 0;
        background: #fff;
      }
      .a4-wrapper {
        box-shadow: none;
        width: 210mm;
        min-height: 297mm;
      }
      .sidebar, .editor-column, .modal-overlay, .editor-toolbar, button, [data-no-print] { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar: folder tree -->
    <aside class="sidebar" role="navigation">
      <header class="sidebar-header">MMB Legal Workspace</header>
      <nav class="sidebar-tree" id="sidebarTree" aria-label="Документы"></nav>
    </aside>

    <!-- Editor -->
    <section class="editor-column" aria-label="Редактор">
      <div class="editor-toolbar">
        <button type="button" class="btn btn-primary" id="btnSave" data-tooltip="Сохранить">Сохранить</button>
        <button type="button" class="btn btn-ghost" id="btnExport" data-tooltip="Печать">Экспорт</button>
        <button type="button" class="btn btn-ghost" id="btnSignature" data-tooltip="Подпись">Подпись</button>
        <button type="button" class="btn btn-ghost" id="btnLoadSample" data-tooltip="Заполнить примером">Пример</button>
        <div class="progress-bar" style="flex: 1; max-width: 120px;">
          <div class="progress-bar-fill" id="progressFill" style="width: 0%;"></div>
        </div>
      </div>
      <form class="editor-form" id="editorForm"></form>
    </section>

    <!-- Preview -->
    <section class="preview-column" aria-label="Предпросмотр">
      <div class="a4-wrapper" id="a4Wrapper">
        <div class="a4-inner" id="a4Preview"></div>
      </div>
    </section>
  </div>

  <!-- Unsaved Changes Modal -->
  <div class="modal-overlay" id="unsavedModal" role="dialog" aria-modal="true" aria-labelledby="unsavedModalTitle" data-no-print>
    <div class="modal">
      <h2 id="unsavedModalTitle">Несохранённые изменения</h2>
      <p style="margin-bottom: var(--space-lg); color: var(--text-secondary); font-size: 0.875rem;">В текущем документе есть несохранённые изменения. Сохранить перед переходом к другому документу?</p>
      <div style="display: flex; gap: var(--space-md);">
        <button type="button" class="btn btn-primary" id="unsavedSave">Сохранить и перейти</button>
        <button type="button" class="btn btn-ghost" id="unsavedDiscard">Не сохранять</button>
        <button type="button" class="btn btn-ghost" id="unsavedCancel">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Signature Modal -->
  <div class="modal-overlay" id="signatureModal" role="dialog" aria-modal="true" aria-labelledby="signatureModalTitle">
    <div class="modal">
      <h2 id="signatureModalTitle">Подпись</h2>
      <div class="signature-pad-container">
        <canvas class="signature-pad" id="signatureCanvas" width="440" height="160"></canvas>
      </div>
      <div style="display: flex; gap: var(--space-md); margin-top: var(--space-lg);">
        <button type="button" class="btn btn-primary" id="btnConfirmSign">Подтвердить</button>
        <button type="button" class="btn btn-ghost" id="btnClearSign">Очистить</button>
        <button type="button" class="btn btn-ghost" id="btnCloseSign">Отмена</button>
      </div>
    </div>
  </div>

  <script>
    /**
     * =============================================================================
     * MMB LEGAL WORKSPACE — ULTRA-SCALABLE SINGLE-FILE PLATFORM
     * =============================================================================
     * Design: 2026 Neo-Minimalism. High-end boutique law firm aesthetic.
     * Stack: Vanilla ES6+, no frameworks. Google Fonts (Inter, Lora) only.
     *
     * ARCHITECTURE OVERVIEW
     * --------------------
     * 1. STATE (State class)
     *    - currentCategoryId, currentTemplateId, currentDocId: navigation
     *    - formData: key-value map of all field values for current template
     *    - dirty: whether form has unsaved changes (blocks switch without confirm)
     *    - signatureDataUrl: base64 PNG of canvas signature for preview/print
     *    - Subscribers notified on any change for optional reactive UI
     *
     * 2. DATABASE (const DATABASE)
     *    - categories[]: each has id, name, docs[]
     *    - docs[]: id, name, status (new|draft|final), fields[], previewTitle, previewTemplate
     *    - fields[]: id, label, type (text|textarea|number|date), required, optional min/max/minLength/maxLength
     *    - previewTemplate: HTML string with {{fieldId}} and {{fieldIdWords}} placeholders
     *
     * 3. REAL-TIME PREVIEW (createReactiveFormData + Proxy)
     *    - Wraps formData in a Proxy; any assignment triggers onUpdate(payload)
     *    - payload includes numeric fields plus *Words for numberToWords() for legal text
     *    - renderPreview() replaces {{x}} in template, injects signature image into canvas placeholders
     *
     * 4. VALIDATION (validateFormData, applyValidationErrors)
     *    - Validates required, number/date format, min/max, minLength/maxLength
     *    - Russian messages in VALIDATION_MESSAGES
     *    - Used on Save; errors applied to .form-group.error and aria-invalid
     *
     * 5. SIGNATURE PAD (initSignaturePad, Smooth Ink)
     *    - Canvas 2D; line width varies by drawing speed (minWidth–maxWidth)
     *    - mousedown/mousemove/mouseup + touch events; preventDefault on touch to avoid scroll
     *    - Result exported as data URL and stored in state.signatureDataUrl; rendered in A4 preview
     *
     * 6. PERSISTENCE (loadStateFromStorage, saveStateToStorage)
     *    - localStorage key: STORAGE_KEY. Saves category, template, formData, signatureDataUrl
     *    - On load: if saved state exists and template valid, selectDocument and hydrate form
     *
     * 7. A4 SCALING (updateA4Scale, ResizeObserver)
     *    - 210mm x 297mm logical size; scale so wrapper fits in preview column
     *    - transform: scale(…) on .a4-wrapper for pixel-perfect fit
     *
     * 8. PRINT (Export)
     *    - @media print hides sidebar, editor, modals; only .preview-column and .a4-wrapper visible
     *    - Zero UI artifacts on printed page
     *
     * DATA FLOW
     * ---------
     * User selects doc in sidebar -> selectDocument(catId, templateId)
     *   -> state updated, renderForm(template), createReactiveFormData(…), renderPreview(…)
     * User types in form -> input/change -> reactiveData[fieldId] = value -> onUpdate -> renderPreview
     * User opens Signature modal -> draw on canvas -> Confirm -> state.signatureDataUrl = dataURL -> renderPreview
     * User Save -> validateFormData -> applyValidationErrors if invalid; else state.dirty = false, saveStateToStorage
     * User Export -> window.print() -> print CSS applies
     *

    /**
     * MMB Legal Workspace — State Management
     * Central state for current document, template, and dirty flag.
     * Prevents losing unsaved changes on switch.
     * Uses explicit getters/setters to allow future persistence (e.g. localStorage) hooks.
     */
    class State {
      constructor() {
        this._data = {
          currentCategoryId: null,
          currentTemplateId: null,
          currentDocId: null,
          formData: {},
          dirty: false,
          signatureDataUrl: null
        };
        this._listeners = new Set();
      }

      get currentCategoryId() { return this._data.currentCategoryId; }
      set currentCategoryId(v) { this._set('currentCategoryId', v); }

      get currentTemplateId() { return this._data.currentTemplateId; }
      set currentTemplateId(v) { this._set('currentTemplateId', v); }

      get currentDocId() { return this._data.currentDocId; }
      set currentDocId(v) { this._set('currentDocId', v); }

      get formData() { return this._data.formData; }
      set formData(v) { this._set('formData', v); }

      get dirty() { return this._data.dirty; }
      set dirty(v) { this._set('dirty', v); }

      get signatureDataUrl() { return this._data.signatureDataUrl; }
      set signatureDataUrl(v) { this._set('signatureDataUrl', v); }

      _set(key, value) {
        if (this._data[key] === value) return;
        this._data[key] = value;
        this._listeners.forEach(fn => fn(key, value));
      }

      subscribe(fn) {
        this._listeners.add(fn);
        return () => this._listeners.delete(fn);
      }
    }

    /**
     * Converts a number to words in Russian (for legal amounts).
     * Supports integers up to millions; decimals as kopecks.
     * @param {number} num - Number to convert
     * @param {string} currency - e.g. 'рублей', 'копеек'
     * @returns {string}
     */
    function numberToWords(num, currency = 'рублей') {
      const ones = ['', 'один', 'два', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
      const teens = ['десять', 'одиннадцать', 'двенадцать', 'тринадцать', 'четырнадцать', 'пятнадцать', 'шестнадцать', 'семнадцать', 'восемнадцать', 'девятнадцать'];
      const tens = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто'];
      const hundreds = ['', 'сто', 'двести', 'триста', 'четыреста', 'пятьсот', 'шестьсот', 'семьсот', 'восемьсот', 'девятьсот'];

      function triple(n) {
        let s = '';
        const h = Math.floor(n / 100);
        const t = Math.floor((n % 100) / 10);
        const o = n % 10;
        if (h) s += hundreds[h] + ' ';
        if (t === 1) return s + teens[o];
        if (t) s += tens[t] + ' ';
        if (o) s += ones[o];
        return s.trim();
      }

      const intPart = Math.floor(num);
      if (intPart === 0) return 'ноль ' + currency;

      let result = '';
      const millions = Math.floor(intPart / 1e6);
      const thousands = Math.floor((intPart % 1e6) / 1000);
      const rest = intPart % 1000;

      if (millions) {
        result += triple(millions) + ' ';
        if (millions === 1) result += 'миллион ';
        else if (millions >= 2 && millions <= 4) result += 'миллиона ';
        else result += 'миллионов ';
      }
      if (thousands) {
        result += triple(thousands) + ' ';
        if (thousands === 1) result += 'тысяча ';
        else if (thousands >= 2 && thousands <= 4) result += 'тысячи ';
        else result += 'тысяч ';
      }
      if (rest) result += triple(rest) + ' ';
      return (result.trim() + ' ' + currency).trim();
    }

    /**
     * Converts a decimal amount to words in Russian (rubles and kopecks).
     * E.g. 1250.50 -> "Одна тысяча двести пятьдесят рублей 50 копеек"
     * @param {number} amount - Full amount (integer or decimal)
     * @returns {string}
     */
    function amountToWordsFull(amount) {
      const intPart = Math.floor(amount);
      const kopecks = Math.round((amount - intPart) * 100);
      const rublesStr = numberToWords(intPart, 'рублей');
      if (kopecks === 0) return rublesStr + ' 00 копеек';
      return rublesStr + ' ' + (kopecks < 10 ? '0' : '') + kopecks + ' копеек';
    }

    const VALIDATION_MESSAGES = {
      required: 'Обязательное поле',
      numberMin: 'Значение не может быть отрицательным',
      numberInvalid: 'Введите число',
      dateInvalid: 'Укажите корректную дату',
      textMinLength: 'Минимальная длина',
      textMaxLength: 'Превышена максимальная длина'
    };

    function validateFormData(formData, template) {
      const errors = [];
      if (!template || !template.fields) return { valid: true, errors: [] };
      for (const field of template.fields) {
        const value = formData[field.id];
        const strVal = value != null ? String(value).trim() : '';
        if (field.required && strVal === '') {
          errors.push({ fieldId: field.id, message: VALIDATION_MESSAGES.required + ': ' + field.label });
        }
        if (field.type === 'number' && strVal !== '') {
          const n = parseFloat(value);
          if (isNaN(n)) errors.push({ fieldId: field.id, message: VALIDATION_MESSAGES.numberInvalid });
          else if (field.min != null && n < field.min) errors.push({ fieldId: field.id, message: VALIDATION_MESSAGES.numberMin });
        }
        if (field.type === 'date' && strVal !== '') {
          const d = new Date(value);
          if (isNaN(d.getTime())) errors.push({ fieldId: field.id, message: VALIDATION_MESSAGES.dateInvalid });
        }
        if (field.minLength != null && strVal.length > 0 && strVal.length < field.minLength) {
          errors.push({ fieldId: field.id, message: VALIDATION_MESSAGES.textMinLength + ' ' + field.minLength });
        }
        if (field.maxLength != null && strVal.length > field.maxLength) {
          errors.push({ fieldId: field.id, message: VALIDATION_MESSAGES.textMaxLength + ' ' + field.maxLength });
        }
      }
      return { valid: errors.length === 0, errors };
    }

    /**
     * Applies validation errors to form: adds .error to form-group and sets aria-invalid.
     */
    function applyValidationErrors(errors) {
      document.querySelectorAll('.form-group').forEach(g => g.classList.remove('error'));
      errors.forEach(({ fieldId }) => {
        const group = document.querySelector('#field-' + fieldId)?.closest('.form-group');
        if (group) group.classList.add('error');
      });
    }

    /**
     * Real-time preview engine: creates a reactive copy of formData
     * so that any change (from form or programmatic) triggers preview update.
     */
    function createReactiveFormData(initial, onUpdate) {
      const numericKeys = new Set();
      DATABASE.categories.forEach(cat => {
        cat.docs.forEach(doc => {
          doc.fields.forEach(f => {
            if (f.type === 'number') numericKeys.add(f.id);
          });
        });
      });

      function buildProxy(target, path = '') {
        return new Proxy(target, {
          set(obj, key, value) {
            const prev = obj[key];
            obj[key] = value;
            const full = path ? path + '.' + key : key;
            let payload = { ...obj };
            if (numericKeys.has(key) && typeof value === 'number' && !isNaN(value)) {
              payload[key + 'Words'] = numberToWords(value);
            }
            onUpdate(payload);
            return true;
          },
          get(obj, key) {
            const v = obj[key];
            if (v !== null && typeof v === 'object' && !Array.isArray(v) && key !== 'length') {
              return buildProxy(v, path ? path + '.' + key : key);
            }
            return v;
          }
        });
      }
      const data = typeof initial === 'object' && initial !== null ? { ...initial } : {};
      return buildProxy(data);
    }

    /**
     * Renders the A4 preview from current template and form data.
     * Replaces {{fieldId}} and {{fieldIdWords}} in the template.
     */
    function renderPreview(templateId, formData) {
      const template = getTemplateById(templateId);
      if (!template) return;
      let html = template.previewTemplate.replace(/\{\{previewTitle\}\}/g, template.previewTitle || '');
      const data = { ...formData };
      const numericKeys = new Set(template.fields.filter(f => f.type === 'number').map(f => f.id));
      numericKeys.forEach(k => {
        const n = parseFloat(data[k]);
        if (!isNaN(n)) data[k + 'Words'] = numberToWords(n);
      });
      template.fields.forEach(f => {
        const val = data[f.id] != null && data[f.id] !== '' ? String(data[f.id]) : '—';
        html = html.replace(new RegExp('\\{\\{' + f.id + '\\}\\}', 'g'), escapeHtml(val));
        const wordsKey = f.id + 'Words';
        if (data[wordsKey]) html = html.replace(new RegExp('\\{\\{' + wordsKey + '\\}\\}', 'g'), escapeHtml(data[wordsKey]));
      });
      html = html.replace(/\{\{[^}]+\}\}/g, '—');
      const container = document.getElementById('a4Preview');
      container.innerHTML = html;
      const sigUrl = state.signatureDataUrl;
      if (sigUrl) {
        container.querySelectorAll('.signature-block canvas').forEach((canvas, i) => {
          const ctx = canvas.getContext('2d');
          const img = new Image();
          img.onload = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          };
          img.src = sigUrl;
        });
      }
      updateProgress(formData, template);
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    /**
     * Returns the template object for a given template ID, or null if not found.
     * @param {string} templateId - Unique ID of the document template
     * @returns {Object|null} Template with fields, previewTitle, previewTemplate
     */
    function getTemplateById(templateId) {
      for (const cat of DATABASE.categories) {
        const doc = cat.docs.find(d => d.id === templateId);
        if (doc) return doc;
      }
      return null;
    }

    /**
     * Formats a date string (YYYY-MM-DD) for display in document text (e.g. "14 февраля 2026 г.").
     * @param {string} dateStr - ISO-style date string
     * @returns {string} Formatted date in Russian
     */
    function formatDateForDocument(dateStr) {
      if (!dateStr) return '—';
      const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ' г.';
    }

    function updateProgress(formData, template) {
      if (!template) return;
      const total = template.fields.length;
      const filled = template.fields.filter(f => {
        const v = formData[f.id];
        return v != null && String(v).trim() !== '';
      }).length;
      const pct = total ? Math.round((filled / total) * 100) : 0;
      const el = document.getElementById('progressFill');
      if (el) el.style.width = pct + '%';
    }

     * @param {string} categoryId - ID of the category (folder)
     * @param {string} templateId - ID of the document template
     */

    /**

     */
    function performSelectDocument(categoryId, templateId) {
      state.currentCategoryId = categoryId;
      state.currentTemplateId = templateId;
      state.currentDocId = categoryId + '/' + templateId;
      state.dirty = false;
      const template = getTemplateById(templateId);
      if (!template) return;
      const initialData = {};
      template.fields.forEach(f => { initialData[f.id] = state.formData[f.id] ?? ''; });
      state.formData = initialData;
      renderForm(template);
      reactiveData = createReactiveFormData(initialData, (payload) => {
        state.formData = payload;
        renderPreview(templateId, payload);
      });
      Object.keys(initialData).forEach(k => { reactiveData[k] = initialData[k]; });
      renderPreview(templateId, state.formData);
      document.querySelectorAll('.doc-item').forEach(el => {
        el.classList.toggle('active', el.dataset.templateId === templateId && el.dataset.categoryId === categoryId);

    /**
     * Renders the editor form for the given template.
     */
    function renderForm(template) {
      const form = document.getElementById('editorForm');
      form.innerHTML = '';
      template.fields.forEach(field => {
        const group = document.createElement('div');
        group.className = 'form-group';
        const label = document.createElement('label');
        label.htmlFor = 'field-' + field.id;
        label.textContent = field.label + (field.required ? ' *' : '');
        const id = 'field-' + field.id;
        let input;
        if (field.type === 'textarea') {
          input = document.createElement('textarea');
          input.rows = 3;
        } else if (field.type === 'number') {
          input = document.createElement('input');
          input.type = 'number';
        } else if (field.type === 'date') {
          input = document.createElement('input');
          input.type = 'date';
        } else {
          input = document.createElement('input');
          input.type = 'text';
        }
        input.id = id;
        input.name = field.id;
        input.value = state.formData[field.id] ?? '';
        input.required = !!field.required;
        input.addEventListener('input', () => {
          state.dirty = true;
          if (reactiveData) reactiveData[field.id] = field.type === 'number' ? parseFloat(input.value) || 0 : input.value;
        });
        input.addEventListener('change', () => {
          if (reactiveData) reactiveData[field.id] = field.type === 'number' ? parseFloat(input.value) || 0 : input.value;
        });
        group.appendChild(label);
        group.appendChild(input);
        form.appendChild(group);
      });
    }

    /**
     * Smooth Ink Signature Pad: variable line width based on drawing speed.
     */
    let signaturePad = {
      canvas: null,
      ctx: null,
      isDrawing: false,
      lastX: 0,
      lastY: 0,
      lastTime: 0,
      minWidth: 1,
      maxWidth: 4,
      smoothing: 0.4
    };

    function initSignaturePad() {
      const canvas = document.getElementById('signatureCanvas');
      if (!canvas) return;
      signaturePad.canvas = canvas;
      signaturePad.ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      signaturePad.ctx.scale(dpr, dpr);
      signaturePad.ctx.strokeStyle = '#1a1a1a';
      signaturePad.ctx.lineCap = 'round';
      signaturePad.ctx.lineJoin = 'round';

      const getCoords = (e) => {
        const r = canvas.getBoundingClientRect();
        if (e.touches) {
          return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
        }
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      };

      const start = (e) => {
        e.preventDefault();
        const { x, y } = getCoords(e);
        signaturePad.isDrawing = true;
        signaturePad.lastX = x;
        signaturePad.lastY = y;
        signaturePad.lastTime = Date.now();
      };
      const move = (e) => {
        e.preventDefault();
        if (!signaturePad.isDrawing) return;
        const { x, y } = getCoords(e);
        const now = Date.now();
        const dt = now - signaturePad.lastTime;
        const dist = Math.hypot(x - signaturePad.lastX, y - signaturePad.lastY);
        const speed = dt > 0 ? dist / dt : 0;
        const width = Math.max(signaturePad.minWidth, signaturePad.maxWidth - speed * 0.05);
        const smoothWidth = (signaturePad.ctx.lineWidth || width) * (1 - signaturePad.smoothing) + width * signaturePad.smoothing;
        signaturePad.ctx.lineWidth = smoothWidth;
        signaturePad.ctx.beginPath();
        signaturePad.ctx.moveTo(signaturePad.lastX, signaturePad.lastY);
        signaturePad.ctx.lineTo(x, y);
        signaturePad.ctx.stroke();
        signaturePad.lastX = x;
        signaturePad.lastY = y;
        signaturePad.lastTime = now;
      };
      const end = () => { signaturePad.isDrawing = false; };

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      canvas.addEventListener('mouseup', end);
      canvas.addEventListener('mouseleave', end);
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      canvas.addEventListener('touchend', end);
    }

    /**

     */
    const STORAGE_KEY = 'mmb-legal-workspace-state';
    function loadStateFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { /* ignore */ }
      return null;
    }
    function saveStateToStorage() {
      try {
        const payload = {
          currentCategoryId: state.currentCategoryId,
          currentTemplateId: state.currentTemplateId,
          formData: state.formData,
          signatureDataUrl: state.signatureDataUrl
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (e) { /* ignore */ }
    }

        alert('Исправьте ошибки:\n' + result.errors.map(e => e.message).join('\n'));

    function updateA4Scale() {
      const wrapper = document.getElementById('a4Wrapper');
      const previewCol = document.querySelector('.preview-column');
      if (!wrapper || !previewCol) return;
      const maxW = previewCol.clientWidth;
      const maxH = previewCol.clientHeight;
      const a4W = 210; // mm
      const a4H = 297;
      const scaleW = maxW / (a4W * 3.78);
      const scaleH = maxH / (a4H * 3.78);
      const scale = Math.min(1, scaleW, scaleH);
      wrapper.style.transform = 'scale(' + scale + ')';
    }
    const resizeObserver = new ResizeObserver(() => updateA4Scale());
    const previewColEl = document.querySelector('.preview-column');
    if (previewColEl) resizeObserver.observe(previewColEl);
    window.addEventListener('resize', updateA4Scale);

    // -------- INIT --------
    const state = new State();
    let reactiveData = null;

    renderSidebar();
    initSignaturePad();
    updateA4Scale();

    const saved = loadStateFromStorage();
    if (saved && saved.currentCategoryId && saved.currentTemplateId) {
      const template = getTemplateById(saved.currentTemplateId);
      if (template) {
        state.formData = saved.formData || {};
        state.signatureDataUrl = saved.signatureDataUrl || null;
        selectDocument(saved.currentCategoryId, saved.currentTemplateId);
        const form = document.getElementById('editorForm');
        template.fields.forEach(f => {
          const input = form.querySelector('#field-' + f.id);
          if (input && state.formData[f.id] != null) input.value = state.formData[f.id];
        });
        reactiveData = createReactiveFormData(state.formData, (payload) => {
          state.formData = payload;
          renderPreview(saved.currentTemplateId, payload);
        });
        Object.keys(state.formData).forEach(k => { reactiveData[k] = state.formData[k]; });
        renderPreview(saved.currentTemplateId, state.formData);
      }
    }
    if (!state.currentTemplateId) {
      const firstCat = DATABASE.categories[0];
      const firstDoc = firstCat.docs[0];
      if (firstCat && firstDoc) selectDocument(firstCat.id, firstDoc.id);
    }
  </script>
</body>
</html>
