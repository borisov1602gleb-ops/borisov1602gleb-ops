<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Футбольный Турнир 2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Tailwind CSS CDN for demo purpose -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;900&family=Montserrat:wght@400;600;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    html,body {
      min-height:100vh;
      /* Allow parallax effect for background */
      overflow-x:hidden;
    }
    body {
      font-family: 'Barlow', 'Montserrat', 'Inter', Arial, sans-serif;
      background: #0a0a0a;
      color: #f4f8fa;
    }
    .parallax-bg {
      z-index: 0;
      position: fixed;
      left: 0; top: 0;
      width: 100vw; height: 100vh;
      object-fit:cover;
      pointer-events: none;
      min-height:100vh;
      /* fallback bg for overlay */
      background: #15141A;
    }
    .bg-gradient-overlay {
      pointer-events:none;
      position:fixed;
      left:0;right:0;top:0;bottom:0;
      z-index:1;
      background: linear-gradient(180deg,rgba(10,10,10,.1) 0%,rgba(10,10,10,0.72) 79%,#090a13 100%);
      min-height:100vh;
      width:100vw;
    }
    /* Animate wave icon */
    @keyframes soundPulse {
      0% { opacity:.65; transform:scale(.98);}
      70%{ opacity:1; transform:scale(1.13);}
      100%{ opacity:.77;transform:scale(.96);}
    }
    .sound-active .icon-wave { animation: soundPulse 1s infinite; filter:drop-shadow(0 0 8px #7bfdff); }
    /* Fade/slide-in utility for blocks */
    .fade-in-up {
      opacity:0;
      transform:translateY(25px);
      transition: opacity .75s cubic-bezier(.25,.75,.74,1.27), transform .7s cubic-bezier(.2,.89,.34,1);
      will-change:opacity,transform;
    }
    .fade-in-up.visible { opacity:1; transform:none; }
    /* Hide scroll for sponsors on mobile */
    @media (max-width: 640px) {
      .marquee { font-size:.91rem; }
    }
    ::-webkit-scrollbar {width:9px;background:#161a24;}
    ::-webkit-scrollbar-thumb {background:#18e6f7;border-radius:7px;}
  </style>
</head>
<body class="relative min-h-screen flex flex-col">
  <!-- Immersive stadium background with parallax -->
  <img id="parallaxBg" class="parallax-bg" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80" alt="stadium-bg">
  <div class="bg-gradient-overlay"></div>

  <!-- Sponsors Marquee -->
  <div class="fixed top-0 left-0 w-full z-30 bg-black/30 border-b border-[#36f4c4]/10 shadow-sm">
    <div class="overflow-hidden whitespace-nowrap py-2">
      <div class="marquee flex gap-6 animate-[scrollmarquee_18s_linear_infinite]" id="sponsors-marquee"></div>
    </div>
  </div>

  <!-- Sound Toggle Button + audio -->
  <button id="soundToggleBtn" aria-label="toggle-sound"
    class="fixed right-4 top-4 z-50 flex items-center gap-2 rounded-2xl px-5 py-2.5 bg-[#191f26] bg-opacity-90 text-[#61ffe7] border border-[#2efbf5]/40
      shadow-[0_8px_40px_0_rgba(60,255,228,0.25)] transition hover:bg-[#21f1d8] hover:text-black sound-active"
    style="backdrop-filter: blur(7px); font-family:'Barlow',sans-serif;">
    <span id="soundIcon" class="icon-wave">
      <svg width="28" height="28" fill="none" viewBox="0 0 28 28"><path d="M3 11v6h5l6 6V5l-6 6H3z" fill="currentColor"/><path id="sndonwave" d="M22 14c0-2.97-1.02-5.12-2.97-6.45A1 1 0 1 1 21 5.64C24.032 7.6 26 10.57 26 14c0 3.43-1.97 6.4-5 8.36a1 1 0 1 1-1.97-1.9C20.972 19.12 22 16.98 22 14z" fill="currentColor"/></svg>
    </span>
    <span class="uppercase font-bold text-sm tracking-widest text-shadow">Звук</span>
  </button>
  <audio id="crowdAudio" src="https://cdn.pixabay.com/audio/2022/10/16/audio_12e8674933.mp3" loop preload="auto"></audio>

  <!-- Main Root -->
  <main id="main-root" class="flex flex-col grow relative z-10">
    <!-- Header -->
    <header class="flex items-center justify-between gap-8 pt-16 pb-8 px-7 sm:px-4" style="z-index:22;">
      <div class="font-extrabold text-3xl sm:text-xl md:text-2xl tracking-widest text-[#08ffee] uppercase font-barlow drop-shadow-[0_3px_16px_#2cfaf8a4]">Турнир 2024</div>
      <nav class="flex gap-3 md:gap-0 rounded-2xl bg-black/50 shadow-lg border border-[#35ffe4]/10 px-3 py-1.5 md:px-2 md:py-1.5 backdrop-blur-md">
        <button class="tab-btn font-barlow font-bold tracking-widest text-base px-6 py-2 mx-1 rounded-2xl uppercase transition border-2 border-transparent text-[#7ffdff] hover:text-[#1bfad0] hover:border-[#61ffe8]" data-tab="group">Групповой этап</button>
        <button class="tab-btn font-barlow font-bold tracking-widest text-base px-6 py-2 mx-1 rounded-2xl uppercase transition border-2 border-transparent text-[#7ffdff] hover:text-[#1bfad0] hover:border-[#61ffe8]" data-tab="playoff">Плей-офф</button>
        <button class="tab-btn font-barlow font-bold tracking-widest text-base px-6 py-2 mx-1 rounded-2xl uppercase transition border-2 border-transparent text-[#7ffdff] hover:text-[#1bfad0] hover:border-[#61ffe8]" data-tab="prizes">Призовой фонд</button>
      </nav>
    </header>
    <!-- Content Panels -->
    <section class="relative flex flex-col grow container mx-auto px-6 max-w-7xl">
      <!-- Groups Panel -->
      <div id="groupPanel" class="fade-in-up block">
        <div class="mb-8 grid grid-cols-1 md:grid-cols-2 gap-16 md:gap-8">
          <!-- Group A Table -->
          <div class="relative rounded-3xl shadow-glass bg-white/10 border border-white/10 backdrop-blur-2xl p-8 pt-7 glass-card overflow-x-auto">
            <div class="uppercase text-lg font-extrabold font-barlow text-[#0efad0] tracking-wider mb-5 drop-shadow">Группа A</div>
            <table class="w-full">
              <thead>
                <tr class="border-b border-white/30 text-left font-barlow text-[#09ffe2] text-xs uppercase tracking-widest">
                  <th class="py-2 font-bold">#</th>
                  <th class="py-2 font-bold">Клуб</th>
                  <th class="py-2 font-bold text-center">И</th>
                  <th class="py-2 font-bold text-center">В</th>
                  <th class="py-2 font-bold text-center">Н</th>
                  <th class="py-2 font-bold text-center">П</th>
                  <th class="py-2 font-bold text-center">Г</th>
                  <th class="py-2 font-bold text-center">О</th>
                </tr>
              </thead>
              <tbody id="group-a-table"></tbody>
            </table>
          </div>
          <!-- Group B Table -->
          <div class="relative rounded-3xl shadow-glass bg-white/10 border border-white/10 backdrop-blur-2xl p-8 pt-7 glass-card overflow-x-auto">
            <div class="uppercase text-lg font-extrabold font-barlow text-[#0efad0] tracking-wider mb-5 drop-shadow">Группа B</div>
            <table class="w-full">
              <thead>
                <tr class="border-b border-white/30 text-left font-barlow text-[#09ffe2] text-xs uppercase tracking-widest">
                  <th class="py-2 font-bold">#</th>
                  <th class="py-2 font-bold">Клуб</th>
                  <th class="py-2 font-bold text-center">И</th>
                  <th class="py-2 font-bold text-center">В</th>
                  <th class="py-2 font-bold text-center">Н</th>
                  <th class="py-2 font-bold text-center">П</th>
                  <th class="py-2 font-bold text-center">Г</th>
                  <th class="py-2 font-bold text-center">О</th>
                </tr>
              </thead>
              <tbody id="group-b-table"></tbody>
            </table>
          </div>
        </div>
      </div>
      <!-- Playoff Panel -->
      <div id="playoffPanel" class="fade-in-up hidden">
        <div class="flex flex-col md:flex-row items-start justify-center gap-10 md:gap-20">
          <!-- Bracket Grid Placeholder -->
          <div class="relative w-full rounded-3xl shadow-glass bg-white/10 border border-white/10 backdrop-blur-2xl p-9 pt-7 flex flex-col items-center glass-card min-h-[320px]">
            <div class="uppercase text-lg font-extrabold font-barlow text-[#0efad0] tracking-wider mb-6">
              Плей-офф Сетка
            </div>
            <div class="flex items-center justify-center h-40 text-2xl md:text-3xl font-extrabold text-[#e8ffbc] tracking-widest drop-shadow animate-pulse select-none">
              Сетка скоро!
            </div>
            <!-- Если есть матчи, тут будет нарисована турнирная сетка -->
          </div>
        </div>
      </div>
      <!-- Prizes/Podium Panel -->
      <div id="prizesPanel" class="fade-in-up hidden mt-6 mb-20">
        <div class="mx-auto w-full flex flex-col items-center justify-center min-h-[320px]">
          <div class="uppercase text-center text-2xl md:text-3xl font-extrabold font-barlow text-[#bced09] tracking-widest mb-12"
            style="text-shadow:0_5px_32px_#bced0994;">
            Призовой Пьедестал
          </div>
          <div id="podium" class="flex md:flex-row flex-col items-end justify-center gap-5 w-full max-w-3xl">
            <!-- Подставляем пьедестал из скрипта -->
          </div>
        </div>
      </div>
    </section>
    <!-- Partners (marquee also at top) -->
    <footer class="mt-auto py-8 text-center z-10 text-[#08ffe6] font-barlow font-semibold text-sm tracking-widest backdrop-blur-2xl bg-black/20">
      <span>© 2024 SUMMER FOOTBALL TOURNAMENT — Все права защищены</span>
    </footer>
  </main>
  <!-- Data/Logic -->
  <script>
  // -------- DATA (add teams for Group A as per last instruction) --------
  const sponsors = [
    {
      name: "SportLife",
      img: "https://seeklogo.com/images/A/adidas-logo-FD7F5DEF12-seeklogo.com.png",
      url: "https://adidas.com/"
    },
    {
      name: "SoccerShop",
      img: "https://seeklogo.com/images/N/nike-logo-7F31D4B897-seeklogo.com.png",
      url: "https://nike.com/"
    },
    {
      name: "ЛигаСпорт",
      img: "https://seeklogo.com/images/P/pepsi-logo-8749D7BEAE-seeklogo.com.png",
      url: "https://pepsi.com/"
    },
    {
      name: "МегаФитнес",
      img: "https://seeklogo.com/images/G/gazprom-logo-2E7B52FA08-seeklogo.com.png",
      url: "https://gazprom.ru"
    },
    {
      name: "СпонсорФонд",
      img: "https://seeklogo.com/images/U/uefa-champions-league-logo-29E9E7980B-seeklogo.com.png",
      url: "#"
    }
  ];
  // for Group A -- 8 teams, as requested
  const groupA = [
    {team: "Беркута", img:"https://upload.wikimedia.org/wikipedia/commons/6/6c/Eagles-fc.png", played: 7, wins: 5, draws: 2, loses: 0, goals: "14-5", pts: 17},
    {team: "Легенда", img:"https://upload.wikimedia.org/wikipedia/commons/c/c2/Crystal_Palace_FC_logo_%282013%29.svg", played: 7, wins: 5, draws: 1, loses: 1, goals: "13-6", pts: 16},
    {team: "Север", img:"https://upload.wikimedia.org/wikipedia/commons/1/18/FK_North_Badge.png", played: 7, wins: 4, draws: 1, loses: 2, goals: "13-8", pts: 13},
    {team: "Молния", img:"https://upload.wikimedia.org/wikipedia/commons/e/e3/Shinoda_lightning_logo.png", played: 7, wins: 3, draws: 3, loses: 1, goals: "11-9", pts: 12},
    {team: "8 чудес света", img:"https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Seven_Wonders_of_the_World.svg/200px-Seven_Wonders_of_the_World.svg.png", played: 7, wins: 3, draws: 0, loses: 4, goals: "8-14", pts: 9},
    {team: "Артемида", img:"https://upload.wikimedia.org/wikipedia/commons/2/2d/Diana-Artemis-symbol.svg", played: 7, wins: 2, draws: 1, loses: 4, goals: "6-11", pts: 7},
    {team: "Сатурн", img:"https://upload.wikimedia.org/wikipedia/commons/9/9e/Saturn_%28planet%29.svg", played: 7, wins: 1, draws: 2, loses: 4, goals: "5-13", pts: 5},
    {team: "ЦСКА", img:"https://upload.wikimedia.org/wikipedia/commons/6/61/CSKA_Moscow_logo.png", played: 7, wins: 0, draws: 0, loses: 7, goals: "4-18", pts: 0}
  ];
  const groupB = [
    {team: "Дельта", img:"https://upload.wikimedia.org/wikipedia/commons/5/5c/Delta_logo_example.svg", played: 3, wins: 2, draws: 1, loses: 0, goals: "6-2", pts: 7},
    {team: "Торнадо", img:"https://upload.wikimedia.org/wikipedia/commons/a/ad/Tornado_Sport_Club_Badge.png", played: 3, wins: 1, draws: 2, loses: 0, goals: "5-3", pts: 5},
    {team: "Атлант", img:"https://upload.wikimedia.org/wikipedia/commons/2/2d/Atalanta_BC_logo.svg", played: 3, wins: 1, draws: 0, loses: 2, goals: "3-5", pts: 3},
    {team: "Ветераны", img:"https://upload.wikimedia.org/wikipedia/commons/9/99/Veterans-Logo-real.png", played: 3, wins: 0, draws: 1, loses: 2, goals: "2-6", pts: 1}
  ];

  const prizes = [
    {
      place: 1,
      label: "I Место",
      style: "from-yellow-200 via-yellow-400 to-[#f8fa5a]",
      icon: "🏆",
      money: "30 000₽",
      items: ["Золотой кубок", "Gold-медали", "Крутые худи", "Сертификат на инвентарь"]
    },
    {
      place: 2,
      label: "II Место",
      style: "from-slate-300 via-gray-200 to-sky-200",
      icon: "🥈",
      money: "15 000₽",
      items: ["Silver-медали", "Сертификат", "Фирменные футболки"]
    },
    {
      place: 3,
      label: "III Место",
      style: "from-amber-300 via-orange-400 to-amber-500",
      icon: "🥉",
      money: "7 500₽",
      items: ["Bronze-медали", "Памятная кружка"]
    }
  ];

  // ---- Animates fade-in-up for all .fade-in-up blocks ----
  function animateVisibleBlocks(){
    const blocks = document.querySelectorAll('.fade-in-up');
    for (const b of blocks) {
      const rect = b.getBoundingClientRect();
      if (rect.top < window.innerHeight - 80) b.classList.add('visible');
    }
  }
  window.addEventListener('scroll', animateVisibleBlocks);
  window.addEventListener('load', animateVisibleBlocks);

  // --------- Fill group tables ----------
  function fillTable(tbodyId, arr) {
    const tbody = document.getElementById(tbodyId);
    tbody.innerHTML = "";
    arr.forEach((row, idx) => {
      tbody.insertAdjacentHTML(
        'beforeend',
        `<tr class="hover:bg-[#0cfafa]/10 border-b border-white/10 transition">
          <td class="py-2 font-extrabold text-[#45f9e3] text-center text-lg">${idx+1}</td>
          <td class="py-2 flex items-center gap-3 font-barlow font-bold">
              <img src="${row.img}" class="h-9 w-9 bg-white/10 rounded-md object-contain border border-[#00fff4]/30 shadow-md" style="filter:drop-shadow(0_3px_7px_#13faf55d);" />
              <span class="uppercase text-white">${row.team}</span>
          </td>
          <td class="py-2 text-center">${row.played}</td>
          <td class="py-2 text-center">${row.wins}</td>
          <td class="py-2 text-center">${row.draws}</td>
          <td class="py-2 text-center">${row.loses}</td>
          <td class="py-2 text-center">${row.goals}</td>
          <td class="py-2 text-center font-bold text-[#61ffe8] text-lg">${row.pts}</td>
        </tr>`
      );
    });
  }
  fillTable('group-a-table', groupA);
  fillTable('group-b-table', groupB);

  // ------ Sponsors Marquee ------
  function renderSponsorsMarquee() {
    const marquee = document.getElementById('sponsors-marquee');
    if (!marquee) return;
    let items = '';
    // repeat 2x for infinite illusion
    for (let i = 0; i < 2; i++) {
      for (const s of sponsors) {
        items += `<a href="${s.url}" target="_blank" class="inline-flex items-center gap-2 mr-5 md:mr-12 font-extrabold font-barlow uppercase text-[#09ffcf] text-shadow hover:text-[#e7fd2e] transition">
          <img src="${s.img}" class="w-9 h-9 object-contain bg-white/0 rounded-md" alt="${s.name}" style="filter:drop-shadow(0 1px 10px #49ffd969);" />
          <span>${s.name}</span>
        </a>`;
      }
    }
    marquee.innerHTML = items;
  }
  renderSponsorsMarquee();

  // ------ Sound Toggle Logic ------
  const crowdAudio = document.getElementById("crowdAudio");
  crowdAudio.volume = 0.18;
  const soundBtn = document.getElementById("soundToggleBtn");
  let isSound = false;
  function updateIcon() {
    if (isSound) {
      soundBtn.classList.add('sound-active');
      document.getElementById("soundIcon").innerHTML = `
      <svg width="28" height="28" fill="none" viewBox="0 0 28 28"><path d="M3 11v6h5l6 6V5l-6 6H3z" fill="currentColor"/><path class="icon-wave" d="M22 14c0-2.97-1.02-5.12-2.97-6.45A1 1 0 1 1 21 5.64C24.032 7.6 26 10.57 26 14c0 3.43-1.97 6.4-5 8.36a1 1 0 1 1-1.97-1.9C20.972 19.12 22 16.98 22 14z" fill="currentColor"/></svg>
      `;
    } else {
      soundBtn.classList.remove('sound-active');
      document.getElementById("soundIcon").innerHTML = `
      <svg width="28" height="28" fill="none" viewBox="0 0 28 28"><path d="M3 11v6h5l6 6V5l-6 6H3z" fill="currentColor"/><path d="M22 6L6 22" stroke="currentColor" stroke-width="2.2"/><path d="M22 22L6 6" stroke="currentColor" stroke-width="2.2"/></svg>
      `;
    }
  }
  soundBtn.addEventListener('click', ()=>{
    if (!isSound) {
      crowdAudio.currentTime = 0;
      crowdAudio.play();
      isSound = true;
    } else {
      crowdAudio.pause();
      isSound = false;
    }
    updateIcon();
  });
  crowdAudio.addEventListener('pause', ()=>{isSound=false;updateIcon()});
  crowdAudio.addEventListener('play', ()=>{isSound=true;updateIcon()});
  updateIcon();

  // ------ Tab switching ------
  const tabBtns = Array.from(document.querySelectorAll('.tab-btn'));
  const groupPanel = document.getElementById('groupPanel');
  const playoffPanel = document.getElementById('playoffPanel');
  const prizesPanel = document.getElementById('prizesPanel');
  function showPanel(type){
    groupPanel.classList.add('hidden');
    playoffPanel.classList.add('hidden');
    prizesPanel.classList.add('hidden');
    groupPanel.classList.remove('block');
    playoffPanel.classList.remove('block');
    prizesPanel.classList.remove('block');
    tabBtns.forEach(b=>b.classList.remove('bg-[#61ffe8]','text-black','border-[#0afbfa]'));
    if(type==="group"){
      groupPanel.classList.remove('hidden');
      groupPanel.classList.add('block');
      tabBtns[0].classList.add('bg-[#61ffe8]','text-black','border-[#0afbfa]');
    }
    if(type==="playoff"){
      playoffPanel.classList.remove('hidden');
      playoffPanel.classList.add('block');
      tabBtns[1].classList.add('bg-[#61ffe8]','text-black','border-[#0afbfa]');
    }
    if(type==="prizes"){
      prizesPanel.classList.remove('hidden');
      prizesPanel.classList.add('block');
      tabBtns[2].classList.add('bg-[#61ffe8]','text-black','border-[#0afbfa]');
    }
    animateVisibleBlocks();
  }
  // Set default tab
  showPanel('group');
  tabBtns[0].classList.add('bg-[#61ffe8]','text-black','border-[#0afbfa]');
  tabBtns.forEach(b=>b.addEventListener('click',e=>{
    showPanel(b.dataset.tab);
  }));

  // ------ 3D Podium Block ------
  function renderPodium(){
    const podiumEl = document.getElementById("podium");
    // Adaptive for mobile: column order [2,1,3] and vertical
    let html = `
      <div class="flex flex-col-reverse md:flex-row w-full gap-3 justify-center items-end md:items-end">
        <div class="podium-block mb-0 md:mb-10 flex-1 flex flex-col items-center ${getPodiumGlow(2)}">
          <div class="bg-gradient-to-t ${prizes[1].style} w-28 md:w-32 h-36 md:h-40 rounded-xl flex flex-col items-center justify-end shadow-lg border-2 border-slate-100/25 relative z-10">
            <span class="text-4xl md:text-5xl absolute -top-8 left-1/2 -translate-x-1/2 drop-shadow-xl">${prizes[1].icon}</span>
            <span class="absolute bottom-[88px] left-1/2 -translate-x-1/2 font-barlow text-slate-900 bg-white/40 px-5 py-1.5 rounded-md text-xs uppercase shadow font-extrabold">${prizes[1].label}</span>
            <div class="text-slate-900 font-extrabold text-lg md:text-2xl mb-3 mt-10">${prizes[1].money}</div>
            <ul class="text-center text-slate-700 font-bold text-xs space-y-1 mb-2">${prizes[1].items.map(i=>`<li>${i}</li>`).join('')}</ul>
          </div>
        </div>
        <div class="podium-block flex-1 flex flex-col items-center ${getPodiumGlow(1)}">
          <div class="bg-gradient-to-t ${prizes[0].style} w-32 md:w-44 h-52 md:h-72 -mb-7 rounded-2xl flex flex-col items-center justify-end shadow-2xl border-2 border-yellow-200/60 relative z-20 scale-110">
            <span class="text-5xl md:text-6xl absolute -top-9 left-1/2 -translate-x-1/2 drop-shadow-2xl">${prizes[0].icon}</span>
            <span class="absolute bottom-[135px] left-1/2 -translate-x-1/2 font-barlow text-[#9b7c0e] bg-white/60 px-7 py-1.5 rounded-xl uppercase shadow font-extrabold tracking-wide">${prizes[0].label}</span>
            <div class="text-[#ba8d13] font-extrabold text-xl md:text-3xl mb-4 mt-16">${prizes[0].money}</div>
            <ul class="text-center text-[#4b491a] font-extrabold text-base space-y-1 mb-3">${prizes[0].items.map(i=>`<li>${i}</li>`).join('')}</ul>
          </div>
        </div>
        <div class="podium-block mb-0 md:mb-5 flex-1 flex flex-col items-center ${getPodiumGlow(3)}">
          <div class="bg-gradient-to-t ${prizes[2].style} w-24 md:w-28 h-32 md:h-32 rounded-lg flex flex-col items-center justify-end shadow-lg border-2 border-amber-800/60 relative z-10">
            <span class="text-3xl md:text-4xl absolute -top-6 left-1/2 -translate-x-1/2 drop-shadow">${prizes[2].icon}</span>
            <span class="absolute bottom-[72px] left-1/2 -translate-x-1/2 font-barlow text-amber-800 bg-white/40 px-4 py-1 rounded font-extrabold uppercase">${prizes[2].label}</span>
            <div class="text-amber-900 font-extrabold text-lg md:text-xl mb-3 mt-10">${prizes[2].money}</div>
            <ul class="text-center text-amber-900 font-bold text-xs space-y-1 mb-2">${prizes[2].items.map(i=>`<li>${i}</li>`).join('')}</ul>
          </div>
        </div>
      </div>
    `;
    podiumEl.innerHTML = html;
  }
  function getPodiumGlow(place){
    if(place===1) return "drop-shadow-[0_0_44px_#ffe96f99]"; 
    if(place===2) return "drop-shadow-[0_0_24px_#b2ebf966]";
    if(place===3) return "drop-shadow-[0_0_15px_#ffbc3b66]";
    return "";
  }
  renderPodium();

  // -- Parallax effect for stadium background on scroll --
  window.addEventListener('scroll', function() {
    const bg = document.getElementById('parallaxBg');
    if (!bg) return;
    const offset = window.scrollY * 0.25;
    bg.style.transform = `translateY(${offset}px) scale(1.07)`;
  });
  </script>
</body>
</html>
