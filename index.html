<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMB — Legal Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       MMB LEGAL WORKSPACE — Design System "Spatial 2026"
       Neo-Minimalism | Glassmorphism | High-end boutique law firm aesthetic
       ========================================================================== */

    :root {
      /* Palette: expensive, minimal, confident */
      --bg-base: #0d0f12;
      --bg-elevated: #14171c;
      --bg-glass: rgba(20, 23, 28, 0.72);
      --glass-border: rgba(255, 255, 255, 0.06);
      --text-primary: #e8eaed;
      --text-secondary: #9aa0a6;
      --text-muted: #5f6368;
      --accent: #7c6ef6;
      --accent-hover: #9389f7;
      --accent-subtle: rgba(124, 110, 246, 0.15);
      --success: #34a853;
      --warning: #f9ab00;
      --danger: #ea4335;
      --sidebar-width: 320px;
      --editor-width: 450px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --blur-sidebar: 40px;
      --shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.25);
      --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-spring: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* ==========================================================================
       LAYOUT — Three-column workspace
       ========================================================================== */

    .workspace {
      display: flex;
      min-height: 100vh;
    }

    /* --------------------------------------------------------------------------
       SIDEBAR — Glassmorphism, multi-level folders, status indicators
       -------------------------------------------------------------------------- */

    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      height: 100vh;
      position: sticky;
      top: 0;
      background: var(--bg-glass);
      backdrop-filter: blur(var(--blur-sidebar));
      -webkit-backdrop-filter: blur(var(--blur-sidebar));
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: transform var(--transition-smooth), opacity var(--transition-smooth);
    }

    .sidebar:hover {
      border-right-color: rgba(255, 255, 255, 0.08);
    }

    .sidebar-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--glass-border);
      flex-shrink: 0;
    }

    .sidebar-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .sidebar-header p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
    }

    .folder-group {
      margin-bottom: 8px;
    }

    .folder-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition-fast), color var(--transition-fast);
      text-align: left;
    }

    .folder-toggle:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--accent);
    }

    .folder-toggle .icon {
      transition: transform var(--transition-spring);
    }

    .folder-group.open .folder-toggle .icon {
      transform: rotate(90deg);
    }

    .folder-children {
      max-height: 0;
      overflow: hidden;
      transition: max-height var(--transition-smooth);
    }

    .folder-group.open .folder-children {
      max-height: 1200px;
    }

    .doc-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px 10px 36px;
      color: var(--text-secondary);
      font-size: 0.8125rem;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: all var(--transition-fast);
    }

    .doc-item:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.03);
    }

    .doc-item.active {
      color: var(--accent);
      background: var(--accent-subtle);
      border-left-color: var(--accent);
    }

    .doc-item .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .doc-item .status-dot.new { background: var(--accent); }
    .doc-item .status-dot.draft { background: var(--warning); }
    .doc-item .status-dot.final { background: var(--success); }

    /* --------------------------------------------------------------------------
       EDITOR — Custom form fields, validation, deep layout
       -------------------------------------------------------------------------- */

    .editor-panel {
      width: var(--editor-width);
      min-width: var(--editor-width);
      background: var(--bg-elevated);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--glass-border);
      flex-shrink: 0;
    }

    .editor-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .editor-doc-name {
      font-size: 1rem;
      font-weight: 700;
      margin-top: 4px;
      color: var(--text-primary);
    }

    .editor-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .field-group {
      margin-bottom: 20px;
    }

    .field-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .field-input,
    .field-textarea,
    .field-select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.875rem;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .field-input:focus,
    .field-textarea:focus,
    .field-select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-subtle);
    }

    .field-input::placeholder,
    .field-textarea::placeholder {
      color: var(--text-muted);
    }

    .field-textarea {
      min-height: 80px;
      resize: vertical;
    }

    .field-input.error,
    .field-textarea.error {
      border-color: var(--danger);
    }

    .field-hint {
      font-size: 0.6875rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .field-error {
      font-size: 0.6875rem;
      color: var(--danger);
      margin-top: 4px;
    }

    .editor-actions {
      padding: 20px 24px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* --------------------------------------------------------------------------
       UI KIT — Buttons, Tooltips, Checkboxes, Progress
       -------------------------------------------------------------------------- */

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-soft);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border: 1px solid var(--glass-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
    }

    .btn-ghost:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.04);
    }

    /* Tooltip */
    [data-tooltip] {
      position: relative;
    }

    [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      padding: 6px 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      font-size: 0.6875rem;
      color: var(--text-secondary);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
    }

    [data-tooltip]:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    /* Checkbox */
    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-wrap input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .checkbox-box {
      width: 18px;
      height: 18px;
      border: 2px solid var(--glass-border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }

    .checkbox-wrap input:checked + .checkbox-box {
      background: var(--accent);
      border-color: var(--accent);
    }

    .checkbox-box::after {
      content: '';
      width: 5px;
      height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) scale(0);
      transition: transform var(--transition-spring);
      margin-bottom: 2px;
    }

    .checkbox-wrap input:checked + .checkbox-box::after {
      transform: rotate(45deg) scale(1);
    }

    /* Progress bar */
    .progress-wrap {
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-hover));
      border-radius: 3px;
      width: 0%;
      transition: width var(--transition-smooth);
    }

    /* --------------------------------------------------------------------------
       PREVIEW — A4 pixel-perfect simulation
       -------------------------------------------------------------------------- */

    .preview-panel {
      flex: 1;
      min-width: 0;
      background: var(--bg-base);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px;
      overflow: auto;
    }

    .a4-container {
      width: 210mm;
      min-height: 297mm;
      background: #fff;
      box-shadow: var(--shadow-soft);
      border-radius: 2px;
      overflow: hidden;
      transform-origin: top center;
    }

    .a4-inner {
      padding: 25mm;
      font-family: 'Lora', Georgia, serif;
      font-size: 11pt;
      line-height: 1.6;
      color: #1a1a1a;
    }

    .a4-inner h1 {
      font-size: 14pt;
      font-weight: 700;
      text-align: center;
      margin-bottom: 1.5em;
    }

    .a4-inner h2 {
      font-size: 12pt;
      font-weight: 600;
      margin: 1em 0 0.5em;
    }

    .a4-inner p {
      margin-bottom: 0.75em;
      text-align: justify;
    }

    .a4-inner .field-placeholder {
      border-bottom: 1px solid #ccc;
      min-height: 1.2em;
      display: inline;
    }

    .a4-inner .signature-zone {
      margin-top: 2em;
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .a4-inner .signature-block {
      flex: 1;
      border: 1px dashed #ccc;
      min-height: 80px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 9pt;
    }

    .a4-inner .signature-block canvas {
      max-width: 100%;
      max-height: 60px;
    }

    /* --------------------------------------------------------------------------
       MODALS — Glassmorphism overlay
       -------------------------------------------------------------------------- */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity var(--transition-smooth), visibility var(--transition-smooth);
    }

    .modal-overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      width: 90%;
      max-width: 480px;
      background: var(--bg-glass);
      backdrop-filter: blur(var(--blur-sidebar));
      -webkit-backdrop-filter: blur(var(--blur-sidebar));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
      padding: 28px;
      transform: scale(0.95);
      transition: transform var(--transition-spring);
    }

    .modal-overlay.visible .modal {
      transform: scale(1);
    }

    .modal h3 {
      font-size: 1.125rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .modal-actions {
      margin-top: 24px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* Signature pad modal */
    .signature-pad-container {
      margin: 20px 0;
      border: 2px solid var(--glass-border);
      border-radius: var(--radius-md);
      background: #fff;
      cursor: crosshair;
      touch-action: none;
    }

    .signature-pad-container canvas {
      display: block;
      width: 100%;
      height: 200px;
      border-radius: var(--radius-sm);
    }

    .signature-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    /* --------------------------------------------------------------------------
       PRINT — Zero UI artifacts on paper
       -------------------------------------------------------------------------- */

    @media print {
      body * {
        visibility: hidden;
      }

      .preview-panel,
      .preview-panel * {
        visibility: visible;
      }

      .preview-panel {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 0;
        background: #fff;
        overflow: visible;
      }

      .a4-container {
        width: 210mm !important;
        min-height: 297mm !important;
        max-width: none !important;
        box-shadow: none !important;
        margin: 0 !important;
      }

      .sidebar,
      .editor-panel,
      .modal-overlay,
      .btn,
      .editor-actions {
        display: none !important;
      }
    }

    /* ==========================================================================
       MICRO-INTERACTIONS — Smooth transitions for hover, click, focus
       ========================================================================== */

    .btn:active {
      transform: translateY(0);
      transition-duration: 0.05s;
    }

    .field-input:hover,
    .field-textarea:hover,
    .field-select:hover {
      border-color: rgba(255, 255, 255, 0.1);
    }

    .doc-item:active {
      background: rgba(124, 110, 246, 0.2);
    }

    .folder-toggle:active {
      background: rgba(255, 255, 255, 0.06);
    }

    .a4-container {
      transition: box-shadow var(--transition-smooth), transform var(--transition-smooth);
    }

    .preview-panel:focus-within .a4-container {
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    /* Scrollbar — minimal, aligned with design */
    .sidebar-nav::-webkit-scrollbar,
    .editor-scroll::-webkit-scrollbar,
    .preview-panel::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .sidebar-nav::-webkit-scrollbar-track,
    .editor-scroll::-webkit-scrollbar-track,
    .preview-panel::-webkit-scrollbar-track {
      background: transparent;
    }

    .sidebar-nav::-webkit-scrollbar-thumb,
    .editor-scroll::-webkit-scrollbar-thumb,
    .preview-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
    }

    .sidebar-nav::-webkit-scrollbar-thumb:hover,
    .editor-scroll::-webkit-scrollbar-thumb:hover,
    .preview-panel::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Progress bar — alternate variant (striped) */
    .progress-wrap.striped .progress-bar {
      background: repeating-linear-gradient(
        -45deg,
        var(--accent),
        var(--accent) 6px,
        var(--accent-hover) 6px,
        var(--accent-hover) 12px
      );
    }

    /* Badge / pill for status in header */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 4px;
      background: var(--accent-subtle);
      color: var(--accent);
    }

    .badge.success { background: rgba(52, 168, 83, 0.2); color: var(--success); }
    .badge.warning { background: rgba(249, 171, 0, 0.2); color: var(--warning); }

    /* Tab-like segment control (optional use in editor) */
    .segment-control {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      border-radius: var(--radius-sm);
      padding: 3px;
      gap: 2px;
    }

    .segment-control button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.8125rem;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .segment-control button:hover {
      color: var(--text-primary);
    }

    .segment-control button.active {
      background: var(--accent-subtle);
      color: var(--accent);
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--glass-border);
      margin: 16px 0;
    }

    /* A4 scale helper — ensure readable scale on small screens */
    @media (max-width: 1400px) {
      .a4-container {
        transform: scale(0.9);
      }
    }

    @media (max-width: 1200px) {
      .a4-container {
        transform: scale(0.8);
      }
    }

    /* Focus visible for accessibility (keyboard nav) */
    .btn:focus-visible,
    .field-input:focus-visible,
    .field-textarea:focus-visible,
    .field-select:focus-visible,
    .folder-toggle:focus-visible,
    .doc-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Reduced motion: respect user preference */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Loading overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13, 15, 18, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 2000;
    }

    .loading-overlay.visible {
      display: flex;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--glass-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    /* Toast notifications */
    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1500;
      pointer-events: none;
    }

    .toast {
      padding: 12px 20px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      font-size: 0.8125rem;
      color: var(--text-primary);
      box-shadow: var(--shadow-soft);
      pointer-events: auto;
      animation: toastIn 0.25s ease-out;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn:disabled,
    .btn.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* ==========================================================================
       THEME: LIGHT (optional [data-theme="light"] on html)
       ========================================================================== */

    [data-theme="light"] {
      --bg-base: #f5f5f7;
      --bg-elevated: #ffffff;
      --bg-glass: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(0, 0, 0, 0.08);
      --text-primary: #1a1a1a;
      --text-secondary: #5f6368;
      --text-muted: #80868b;
      --accent: #5e5ce6;
      --accent-hover: #7d7aff;
      --accent-subtle: rgba(94, 92, 230, 0.12);
    }

    [data-theme="light"] .sidebar:hover {
      border-right-color: rgba(0, 0, 0, 0.12);
    }

    [data-theme="light"] .field-input,
    [data-theme="light"] .field-textarea,
    [data-theme="light"] .field-select {
      background: rgba(0, 0, 0, 0.04);
      border-color: rgba(0, 0, 0, 0.12);
      color: var(--text-primary);
    }

    [data-theme="light"] .doc-item:hover {
      background: rgba(0, 0, 0, 0.04);
    }

    [data-theme="light"] .doc-item.active {
      background: var(--accent-subtle);
      color: var(--accent);
    }

    [data-theme="light"] .btn-secondary {
      background: rgba(0, 0, 0, 0.06);
      border-color: rgba(0, 0, 0, 0.12);
      color: var(--text-primary);
    }

    [data-theme="light"] .modal {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(0, 0, 0, 0.1);
    }

    [data-theme="light"] .loading-overlay {

     * Single-file "All-in-One" legal document platform. No external libraries

     * - State: central state with subscribe() for real-time A4 preview updates
     * - DATABASE: 15 document templates in 4 categories (corporate, labor, realty, finance)
     * - numberToWords / numberToWordsExtended: Russian legal amount in words
     * - Signature pad: canvas-based smooth ink (variable line width by velocity)
     * - PREVIEW_LAYOUTS: per-template A4 HTML with placeholders and signatures
     * - DocumentManager: save/load and dirty-state stubs
     * - ExportEngine: print and future PDF hooks
     * - Validation: validateField / validateCurrentDocument for form errors
     * ==========================================================================
     *
     * ARCHITECTURE & DATA FLOW
     * -----------------------
     * 1. User selects document in sidebar -> selectDocument(id) -> State.setCurrentTemplate(id)
     *    -> renderEditorForm(template) fills editor with fields; applyDefaultsForTemplate(id)
     *    if document data empty; renderPreview() builds A4 HTML from PREVIEW_LAYOUTS[layout](data).
     *
     * 2. User types in editor -> input/change -> State.setField(key, value). Subscribers run:
     *    - If field is number and template has matching *Words field, auto-fill numberToWords().
     *    - renderPreview() re-runs so A4 updates in real time.
     *
     * 3. User clicks "Подписать" -> signature modal opens; user draws on canvas. "Применить"
     *    -> getSignatureDataUrl() -> State.setField(signatureKey, dataUrl) -> preview shows image.
     *
     * 4. User clicks "Сохранить" -> validateCurrentDocument(); if errors, applyValidationErrors();
     *    else DocumentManager.save() (stub), showToast/hideLoading.
     *
     * 5. User clicks "Экспорт" -> window.print(). @media print hides sidebar/editor, shows only
     *    .preview-panel and .a4-container for clean paper/PDF output.

     * -----------

     * --------------------------

    /* --------------------------------------------------------------------------
       NUMBER TO WORDS — Russian legal compliance (e.g. 1250 -> Одна тысяча...)
       -------------------------------------------------------------------------- */

    const ONES = ['', 'один', 'два', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
    const ONES_F = ['', 'одна', 'две', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
    const TENS = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто'];
    const TEENS = ['десять', 'одиннадцать', 'двенадцать', 'тринадцать', 'четырнадцать', 'пятнадцать', 'шестнадцать', 'семнадцать', 'восемнадцать', 'девятнадцать'];

    /**
     * Converts a number (0-999) to Russian words using feminine forms for thousands.
     * Used internally by numberToWords. Feminine form required for "одна/две тысячи".
     * @param {number} n - Number to convert (0-999)
     * @param {boolean} feminine - Use feminine forms (for thousands)
     * @returns {string} Trailing space included for concatenation
     */
    function numberToWordsHundreds(n, feminine = false) {
      if (n === 0) return '';
      const arr = feminine ? ONES_F : ONES;
      const h = Math.floor(n / 100);
      const t = Math.floor((n % 100) / 10);
      const o = n % 10;
      let s = '';
      if (h === 1) s += 'сто ';
      else if (h === 2) s += 'двести ';
      else if (h >= 3 && h <= 4) s += ['', 'триста ', 'четыреста '][h - 2];
      else if (h >= 5) s += ONES[h] + 'сот ';
      if (t === 1) return s + TEENS[o] + ' ';
      if (t > 1) s += TENS[t] + ' ';
      s += arr[o] + ' ';
      return s;
    }

    /**
     * Converts integer amount to full Russian words (for legal compliance in documents).
     * Handles thousands with correct feminine forms (одна тысяча, две тысячи, пять тысяч).
     * @param {number} num - Integer amount (e.g. 1250)
     * @param {string} currency - "рублей" | "копеек" | "процентов" etc.
     * @returns {string} e.g. "Одна тысяча двести пятьдесят рублей"
     */
    function numberToWords(num, currency = 'рублей') {
      const n = Math.floor(Number(num)) || 0;
      if (n === 0) return 'Ноль ' + currency;
      const thousands = Math.floor(n / 1000);
      const rest = n % 1000;
      let result = '';
      if (thousands > 0) {
        const th = numberToWordsHundreds(thousands, true);
        if (thousands === 1) result += 'одна тысяча ';
        else if (thousands >= 2 && thousands <= 4) result += th + 'тысячи ';
        else result += th + 'тысяч ';
      }
      result += numberToWordsHundreds(rest, false);
      result = result.trim();
      const first = result.charAt(0).toUpperCase();
      result = first + result.slice(1);
      return result + ' ' + currency;
    }

    /**
     * Validates a single field value against template field config (required, type).
     * @param {object} field - Template field descriptor { key, label, type, required }
     * @param {*} value - Current value
     * @returns {string|null} Error message or null if valid
     */
    function validateField(field, value) {
      const str = value != null ? String(value).trim() : '';
      if (field.required && !str) return (ERROR_MESSAGES && ERROR_MESSAGES.required) ? ERROR_MESSAGES.required(field.label) : `Поле «${field.label}» обязательно для заполнения`;
      if (field.type === 'number' && str && isNaN(Number(str))) return ERROR_MESSAGES.invalidNumber || 'Введите число';
      if (field.type === 'date' && str) {
        const d = new Date(str);
        if (isNaN(d.getTime())) return ERROR_MESSAGES.invalidDate || 'Некорректная дата';
      }
      return null;
    }

    /* --------------------------------------------------------------------------
       VALIDATION UI — Display errors in editor and highlight invalid fields
       -------------------------------------------------------------------------- */

    /**
     * Applies validation errors to the editor: adds .error class and shows .field-error.
     * @param {Array<{key: string, message: string}>} errors
     */
    function applyValidationErrors(errors) {
      const container = document.getElementById('editorScroll');
      if (!container) return;
      container.querySelectorAll('.field-input, .field-textarea').forEach(el => {
        el.classList.remove('error');
        const key = el.getAttribute('data-key');
        const errEl = container.querySelector(`[data-error-for="${key}"]`);
        if (errEl) errEl.remove();
      });
      errors.forEach(({ key, message }) => {
        const input = container.querySelector(`[data-key="${key}"]`);
        if (input) {
          input.classList.add('error');
          const wrap = input.closest('.field-group');
          if (wrap) {
            let errEl = wrap.querySelector('.field-error');
            if (!errEl) {
              errEl = document.createElement('p');
              errEl.className = 'field-error';
              errEl.setAttribute('data-error-for', key);
              wrap.appendChild(errEl);
            }
            errEl.textContent = message;
          }
        }
      });
    }

    /**
     * Clears all validation error state from the editor.
     */
    function clearValidationErrors() {
      applyValidationErrors([]);
    }

    /**
     * Validates all fields of current document. Returns array of { key, message }.
     * @returns {Array<{key: string, message: string}>}
     */
    function validateCurrentDocument() {
      const templateId = appState.getCurrentTemplateId();
      const template = DATABASE.templates.find(t => t.id === templateId);
      if (!template) return [];
      const data = appState.getData();
      const errors = [];
      template.fields.forEach(f => {
        const err = validateField(f, data[f.key]);
        if (err) errors.push({ key: f.key, message: err });
      });
      return errors;
    }

    /**
     * Formats date string (YYYY-MM-DD) to Russian locale (DD.MM.YYYY).
     * @param {string} dateStr
     * @returns {string}
     */
    function formatDateLocal(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr + 'T12:00:00');
      if (isNaN(d.getTime())) return dateStr;
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${day}.${month}.${year}`;
    }

    /**
     * Extended number-to-words for large amounts (millions). Used for real estate etc.
     * @param {number} num - Integer (e.g. 15_000_000)
     * @param {string} currency
     * @returns {string}
     */
    function numberToWordsExtended(num, currency = 'рублей') {
      const n = Math.floor(Number(num)) || 0;
      if (n < 1000000) return numberToWords(n, currency);
      const millions = Math.floor(n / 1000000);
      const rest = n % 1000000;
      let result = '';
      const mPart = numberToWordsHundreds(millions, false);
      if (millions === 1) result += mPart + 'миллион ';
      else if (millions >= 2 && millions <= 4) result += mPart + 'миллиона ';
      else result += mPart + 'миллионов ';
      if (rest > 0) result += numberToWordsHundreds(Math.floor(rest / 1000), true) + (rest >= 1000 ? (Math.floor(rest / 1000) === 1 ? 'тысяча ' : Math.floor(rest / 1000) <= 4 ? 'тысячи ' : 'тысяч ') : '') + numberToWordsHundreds(rest % 1000, false);
      result = result.trim();
      result = result.charAt(0).toUpperCase() + result.slice(1);
      return result + ' ' + currency;
    }

    /* --------------------------------------------------------------------------
       STATE MANAGEMENT — Central state with Proxy for real-time preview
       -------------------------------------------------------------------------- */

    class State {
      constructor() {
        this._currentTemplateId = null;
        this._values = {}; // templateId -> { fieldKey: value }
        this._listeners = [];
        const self = this;
        this._proxy = new Proxy(this._values, {
          set(target, prop, value) {
            if (typeof prop === 'string' && !prop.startsWith('_')) {
              const prev = target[prop];
              target[prop] = value;
              self._notify(prop, value, prev);
            }
            return true;
          }
        });
      }

      /**
       * Get current template id.
       */
      getCurrentTemplateId() {
        return this._currentTemplateId;
      }

      /**
       * Set current template and optionally load saved values.
       */
      setCurrentTemplate(templateId) {
        this._currentTemplateId = templateId;
        if (!this._values[templateId]) {
          this._values[templateId] = {};
        }
        this._notify('template', templateId, null);
      }

      /**
       * Get values for current template (returns reactive object for that template's data).
       */
      getData() {
        const id = this._currentTemplateId;
        if (!id || !this._values[id]) return {};
        return this._values[id];
      }

      /**
       * Set a single field value for current template. Triggers preview update.
       */
      setField(key, value) {
        const id = this._currentTemplateId;
        if (!id) return;
        if (!this._values[id]) this._values[id] = {};
        this._values[id][key] = value;
        this._notify('field', { key, value }, null);
      }

      /**
       * Get field value for current template.
       */
      getField(key) {
        const data = this.getData();
        return data[key] !== undefined ? data[key] : '';
      }

      /**
       * Subscribe to state changes (for real-time preview).
       */
      subscribe(callback) {
        this._listeners.push(callback);
        return () => {
          this._listeners = this._listeners.filter(cb => cb !== callback);
        };
      }

      _notify(type, payload, previous) {
        this._listeners.forEach(cb => cb({ type, payload, previous }));
      }

      /**
       * Check for unsaved changes (simplified: always allow switch, could add dirty flag).
       */
      hasUnsavedChanges() {
        return false;
      }
    }

    const appState = new State();

    /* --------------------------------------------------------------------------
       LOCAL STORAGE PERSISTENCE — Save/load document data to localStorage
       -------------------------------------------------------------------------- */

    const STORAGE_KEY_PREFIX = 'mmb_legal_doc_';
    const STORAGE_VERSION = 1;

    function loadDocumentFromStorage(templateId) {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_PREFIX + templateId);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && parsed.v === STORAGE_VERSION && parsed.data) return parsed.data;
        return null;
      } catch (e) {
        return null;
      }
    }

    function saveDocumentToStorage(templateId, data) {
      try {
        localStorage.setItem(STORAGE_KEY_PREFIX + templateId, JSON.stringify({
          v: STORAGE_VERSION,
          data,
          savedAt: new Date().toISOString()
        }));
      } catch (e) {
        console.warn('localStorage save failed', e);
      }
    }

    let _saveDebounceTimer = null;
    function debouncedSaveToStorage() {
      if (_saveDebounceTimer) clearTimeout(_saveDebounceTimer);
      _saveDebounceTimer = setTimeout(() => {
        const id = appState.getCurrentTemplateId();
        if (id) saveDocumentToStorage(id, appState.getData());
        _saveDebounceTimer = null;
      }, 1000);
    }

    /* --------------------------------------------------------------------------
       UTILITY FUNCTIONS — Debounce, throttle, shallow clone
       -------------------------------------------------------------------------- */

    function debounce(fn, ms) {
      let timer = null;
      return function (...args) {
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => { fn.apply(this, args); timer = null; }, ms);
      };
    }

    function throttle(fn, ms) {
      let last = 0;
      return function (...args) {
        const now = Date.now();
        if (now - last >= ms) {
          last = now;
          fn.apply(this, args);
        }
      };
    }

    function shallowClone(obj) {
      if (obj == null || typeof obj !== 'object') return obj;
      return Array.isArray(obj) ? [...obj] : { ...obj };
    }

    /**
     * Deep merge of target with source (one level deep for our use case).
     */
    function mergeData(target, source) {
      const out = shallowClone(target);
      if (source && typeof source === 'object') {
        Object.keys(source).forEach(k => { out[k] = source[k]; });
      }
      return out;
    }

    /* --------------------------------------------------------------------------
       SIGNATURE PAD — Canvas with smooth ink (variable line width by speed)
       --------------------------------------------------------------------------
       "Smooth Ink" technology: line width varies with drawing speed. Fast strokes
       produce thinner lines; slow strokes produce thicker lines, mimicking real pen.
       Uses requestAnimationFrame-friendly mousemove/touchmove. Velocity is smoothed
       with exponential moving average (0.3/0.7) to avoid jitter.
       -------------------------------------------------------------------------- */

    let signaturePadCtx = null;
    let signPadIsDrawing = false;
    let signPadLastX = 0, signPadLastY = 0;
    let signPadLastTime = 0;
    let signPadVelocity = 0;
    const SIGN_MIN_WIDTH = 1;
    const SIGN_MAX_WIDTH = 4;
    const SIGN_VELOCITY_FACTOR = 0.5;

    /**
     * Initializes the signature canvas and event listeners for smooth drawing.
     */
    function initSignaturePad() {
      const canvas = document.getElementById('signaturePad');
      if (!canvas) return;
      const wrap = document.getElementById('signaturePadWrap');
      const dpr = window.devicePixelRatio || 1;
      const rect = wrap.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = 200 * dpr;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = '200px';
      signaturePadCtx = canvas.getContext('2d');
      signaturePadCtx.scale(dpr, dpr);
      signaturePadCtx.strokeStyle = '#1a1a1a';
      signaturePadCtx.lineCap = 'round';
      signaturePadCtx.lineJoin = 'round';

      const getCoords = (e) => {
        const r = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - r.left, y: clientY - r.top };
      };

      const start = (e) => {
        e.preventDefault();
        signPadIsDrawing = true;
        const { x, y } = getCoords(e);
        signPadLastX = x;
        signPadLastY = y;
        signPadLastTime = Date.now();
        signPadVelocity = 0;
      };

      const move = (e) => {
        e.preventDefault();
        if (!signPadIsDrawing || !signaturePadCtx) return;
        const { x, y } = getCoords(e);
        const now = Date.now();
        const dt = (now - signPadLastTime) / 1000 || 0.01;
        const dist = Math.hypot(x - signPadLastX, y - signPadLastY);
        const velocity = dist / dt;
        signPadVelocity = signPadVelocity * 0.3 + velocity * 0.7;
        const lineWidth = Math.max(SIGN_MIN_WIDTH, SIGN_MAX_WIDTH - signPadVelocity * SIGN_VELOCITY_FACTOR);
        signaturePadCtx.lineWidth = lineWidth;
        signaturePadCtx.beginPath();
        signaturePadCtx.moveTo(signPadLastX, signPadLastY);
        signaturePadCtx.lineTo(x, y);
        signaturePadCtx.stroke();
        signPadLastX = x;
        signPadLastY = y;
        signPadLastTime = now;
      };

      const end = () => {
        signPadIsDrawing = false;
      };

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      canvas.addEventListener('mouseup', end);
      canvas.addEventListener('mouseleave', end);
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      canvas.addEventListener('touchend', end);
    }

    /**
     * Clears the signature canvas.
     */
    function clearSignaturePad() {
      const canvas = document.getElementById('signaturePad');
      if (!canvas || !signaturePadCtx) return;
      const w = canvas.getBoundingClientRect().width;
      const h = 200;
      signaturePadCtx.clearRect(0, 0, w, h);
    }

    /**
     * Returns current signature as data URL (PNG) or null.
     */
    function getSignatureDataUrl() {
      const canvas = document.getElementById('signaturePad');
      if (!canvas) return null;
      try {
        return canvas.toDataURL('image/png');
      } catch (e) {
        return null;
      }
    }

    /* --------------------------------------------------------------------------
       SIDEBAR RENDER — Build folder tree and document list
       -------------------------------------------------------------------------- */

    function renderSidebar() {
      const nav = document.getElementById('sidebarNav');
      if (!nav) return;
      let html = '';
      DATABASE.categories.forEach(cat => {
        const templates = DATABASE.templates.filter(t => t.categoryId === cat.id);
        const groupId = 'folder-' + cat.id;
        html += `
          <div class="folder-group" data-folder="${cat.id}" id="${groupId}">
            <button type="button" class="folder-toggle" aria-expanded="false">
              <span>${cat.name}</span>
              <span class="icon">▶</span>
            </button>
            <div class="folder-children">
              ${templates.map(t => `
                <div class="doc-item ${appState.getCurrentTemplateId() === t.id ? 'active' : ''}" data-doc="${t.id}" data-status="${t.status}">
                  <span class="status-dot ${t.status}"></span>
                  <span>${t.name}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });
      nav.innerHTML = html;

      nav.querySelectorAll('.folder-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const group = btn.closest('.folder-group');
          group.classList.toggle('open');
          btn.setAttribute('aria-expanded', group.classList.contains('open'));
        });
      });

      nav.querySelectorAll('.doc-item').forEach(item => {
        item.addEventListener('click', () => {
          const id = item.getAttribute('data-doc');
          if (id) selectDocument(id);
        });
      });

      // Open first folder by default
      const first = nav.querySelector('.folder-group');
      if (first) first.classList.add('open');
    }

    /**
     * Selects a document: updates state, editor form, and preview.
     */
    function selectDocument(templateId) {
      appState.setCurrentTemplate(templateId);
      const template = DATABASE.templates.find(t => t.id === templateId);
      if (!template) return;
      document.getElementById('editorDocName').textContent = template.name;
      let data = appState.getData();
      const stored = loadDocumentFromStorage(templateId);
      if (stored && Object.keys(stored).length > 0) {
        Object.entries(stored).forEach(([k, v]) => appState.setField(k, v));
        data = appState.getData();
      }
      const isEmpty = Object.keys(data).length === 0;
      if (isEmpty) applyDefaultsForTemplate(templateId);
      renderEditorForm(template);
      renderPreview();
      clearValidationErrors();
      document.querySelectorAll('.doc-item').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-doc') === templateId);
      });
    }

    /**
     * FormRenderer — Encapsulates building of editor form DOM from template fields.
     * Used by renderEditorForm() to keep markup generation in one place.
     */
    const FormRenderer = {
      buildFieldGroup(field, templateId, value, meta) {
        const id = 'field-' + field.key;
        const req = field.required ? ' required' : '';
        const ph = (meta && meta.placeholder) || '';
        const hint = (meta && meta.hint) || '';
        const safe = (s) => (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        if (field.type === 'textarea') {
          return `<div class="field-group"><label class="field-label" for="${id}">${field.label}</label><textarea class="field-textarea" id="${id}" data-key="${field.key}" placeholder="${safe(ph)}" title="${safe(hint)}"${req}>${safe(value)}</textarea></div>`;
        }
        if (field.type === 'number') {
          const extraHint = /amount|price|salary|rent/i.test(field.key) ? '<p class="field-hint">Прописью подставится автоматически в превью</p>' : '';
          return `<div class="field-group"><label class="field-label" for="${id}">${field.label}</label><input type="number" class="field-input" id="${id}" data-key="${field.key}" value="${safe(value)}" placeholder="${safe(ph)}"${req} />${extraHint}</div>`;
        }
        if (field.type === 'date') {
          return `<div class="field-group"><label class="field-label" for="${id}">${field.label}</label><input type="date" class="field-input" id="${id}" data-key="${field.key}" value="${safe(value)}"${req} /></div>`;
        }
        if (field.type === 'signature') {
          const signHtml = value && String(value).startsWith('data:image') ? `<img src="${value}" alt="Подпись" style="max-height:50px;" />` : '<span style="color:var(--text-muted); font-size:0.75rem;">Нажмите «Подписать» и выберите поле</span>';
          return `<div class="field-group"><label class="field-label">${field.label}</label><div class="signature-block" data-sign-field="${field.key}" style="min-height:60px; border:1px dashed var(--glass-border); border-radius:6px; display:flex; align-items:center; justify-content:center;">${signHtml}</div></div>`;
        }
        return `<div class="field-group"><label class="field-label" for="${id}">${field.label}</label><input type="text" class="field-input" id="${id}" data-key="${field.key}" value="${safe(value)}" placeholder="${safe(ph)}" title="${safe(hint)}"${req} /></div>`;
      }
    };

    /**
     * Renders the editor form for the given template (all fields).
     */
    function renderEditorForm(template) {
      const container = document.getElementById('editorScroll');
      if (!container) return;
      let html = '';
      template.fields.forEach(f => {
        const val = appState.getField(f.key);
        const id = 'field-' + f.key;
        const req = f.required ? ' required' : '';
        const meta = TEMPLATE_FIELD_META[template.id] && TEMPLATE_FIELD_META[template.id][f.key];
        const ph = (meta && meta.placeholder) || '';
        const hint = (meta && meta.hint) || '';
        if (f.type === 'textarea') {
          html += `
            <div class="field-group">
              <label class="field-label" for="${id}">${f.label}</label>
              <textarea class="field-textarea" id="${id}" data-key="${f.key}" placeholder="${escapeHtml(ph)}" title="${escapeHtml(hint)}"${req}>${escapeHtml(val)}</textarea>
            </div>
          `;
        } else if (f.type === 'number') {
          html += `
            <div class="field-group">
              <label class="field-label" for="${id}">${f.label}</label>
              <input type="number" class="field-input" id="${id}" data-key="${f.key}" value="${escapeHtml(val)}" placeholder="${escapeHtml(ph)}"${req} />
              ${f.key.toLowerCase().includes('amount') || f.key.toLowerCase().includes('price') || f.key.toLowerCase().includes('salary') || f.key === 'amount' ? '<p class="field-hint">Прописью подставится автоматически в превью</p>' : ''}
            </div>
          `;
        } else if (f.type === 'date') {
          html += `
            <div class="field-group">
              <label class="field-label" for="${id}">${f.label}</label>
              <input type="date" class="field-input" id="${id}" data-key="${f.key}" value="${escapeHtml(val)}"${req} />
            </div>
          `;
        } else if (f.type === 'signature') {
          html += `
            <div class="field-group">
              <label class="field-label">${f.label}</label>
              <div class="signature-block" data-sign-field="${f.key}" style="min-height:60px; border:1px dashed var(--glass-border); border-radius:6px; display:flex; align-items:center; justify-content:center;">
                ${val && val.startsWith && val.startsWith('data:image') ? `<img src="${val}" alt="Подпись" style="max-height:50px;" />` : '<span style="color:var(--text-muted); font-size:0.75rem;">Нажмите «Подписать» и выберите поле</span>'}
              </div>
            </div>
          `;
        } else {
          html += `
            <div class="field-group">
              <label class="field-label" for="${id}">${f.label}</label>
              <input type="text" class="field-input" id="${id}" data-key="${f.key}" value="${escapeHtml(val)}" placeholder="${escapeHtml(ph)}" title="${escapeHtml(hint)}"${req} />
            </div>
          `;
        }
      });
      container.innerHTML = html;

      container.querySelectorAll('.field-input, .field-textarea, .field-select').forEach(input => {
        const key = input.getAttribute('data-key');
        if (!key) return;
        input.addEventListener('input', () => appState.setField(key, input.value));
        input.addEventListener('change', () => appState.setField(key, input.value));
      });
    }

    function escapeHtml(str) {
      if (str == null) return '';
      const s = String(str);
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* --------------------------------------------------------------------------
       AUTO-FORMAT: Sync number fields to words in preview
       -------------------------------------------------------------------------- */

    /**
     * Map from numeric field key to corresponding "words" field key for auto-fill.
     */
    const NUMBER_TO_WORDS_KEYS = {
      priceAmount: 'priceWords',
      salary: 'salaryWords',
      amount: 'amountWords',
      rentAmount: 'rentWords',
      authorizedCapital: null
    };

    appState.subscribe(({ type, payload }) => {
      if (type === 'field') {
        const key = payload.key;
        const value = payload.value;
        const templateId = appState.getCurrentTemplateId();
        const template = DATABASE.templates.find(t => t.id === templateId);
        if (template) {
          const field = template.fields.find(f => f.key === key);
          if (field && field.type === 'number') {
            const num = Number(value);
            if (!isNaN(num) && num >= 0) {
              const wordsKey = NUMBER_TO_WORDS_KEYS[key] || (key.replace(/(Amount|price|salary|rent|amount)$/i, '') + 'Words');
              const wordsField = template.fields.find(f => f.key === wordsKey);
              if (wordsField) {
                const words = numberToWords(num);
                appState.setField(wordsField.key, words);
                const input = document.getElementById('field-' + wordsField.key);
                if (input && input.value !== words) input.value = words;
              }
            }
          }
        }
        renderPreview();
        debouncedSaveToStorage();
      }
      if (type === 'template') renderPreview();
    });

    /* --------------------------------------------------------------------------
       MODAL: Open signature, apply to selected field
       -------------------------------------------------------------------------- */

    let currentSignFieldKey = null;

    /**
     * Opens signature modal. If a signature block in the editor was focused/clicked,
     * currentSignFieldKey can be set to that field's key so "Apply" fills the right block.
     */
    document.getElementById('btnSign')?.addEventListener('click', () => {
      const firstSignField = DATABASE.templates.find(t => t.id === appState.getCurrentTemplateId())?.fields.find(f => f.type === 'signature');
      currentSignFieldKey = firstSignField ? firstSignField.key : null;
      document.getElementById('signatureModal').classList.add('visible');
      clearSignaturePad();
    });

    /**
     * Delegate: when user clicks a signature placeholder in the editor, open modal
     * and set currentSignFieldKey so that applying signature fills that field.
     */
    document.getElementById('editorScroll')?.addEventListener('click', (e) => {
      const block = e.target.closest('[data-sign-field]');
      if (block) {
        const key = block.getAttribute('data-sign-field');
        if (key) {
          currentSignFieldKey = key;
          document.getElementById('signatureModal').classList.add('visible');
          clearSignaturePad();
        }
      }
    });

    document.getElementById('btnCloseSign')?.addEventListener('click', () => {
      document.getElementById('signatureModal').classList.remove('visible');
    });

    document.getElementById('btnClearSign')?.addEventListener('click', clearSignaturePad);

    document.getElementById('btnApplySign')?.addEventListener('click', () => {
      const dataUrl = getSignatureDataUrl();
      if (dataUrl && currentSignFieldKey) {
        appState.setField(currentSignFieldKey, dataUrl);
        const block = document.querySelector(`[data-sign-field="${currentSignFieldKey}"]`);
        if (block) block.innerHTML = `<img src="${dataUrl}" alt="Подпись" style="max-height:50px;" />`;
      }
      document.getElementById('signatureModal').classList.remove('visible');
      renderPreview();
    });

    /* --------------------------------------------------------------------------
       EXPORT / PRINT
       -------------------------------------------------------------------------- */

    document.getElementById('btnExport')?.addEventListener('click', () => {
      window.print();
    });

    document.getElementById('btnSave')?.addEventListener('click', () => {
      const errors = validateCurrentDocument();
      if (errors.length > 0) {
        applyValidationErrors(errors);
        return;
      }
      clearValidationErrors();
      const id = appState.getCurrentTemplateId();
      const data = appState.getData();
      DocumentManager.save().then(() => {
        console.log('Save document', id, data);
        alert('Сохранение: в реальном приложении данные отправляются на сервер.');
      });
    });

    /* --------------------------------------------------------------------------
       DOCUMENT MANAGER — Centralized save/load and dirty state (stub for backend)
       -------------------------------------------------------------------------- */

    /**
     * DocumentManager handles persistence and unsaved-changes state.
     * In production would integrate with REST API or IndexedDB.
     */
    const DocumentManager = {
      /** In-memory cache of last saved state per template (for dirty check) */
      _lastSaved: {},

      /**
       * Marks current document as saved (stores snapshot of current data).
       */
      markSaved() {
        const id = appState.getCurrentTemplateId();
        if (!id) return;
        const data = appState.getData();
        this._lastSaved[id] = JSON.stringify(data);
      },

      /**
       * Returns true if current document has changes since last save.
       */
      isDirty() {
        const id = appState.getCurrentTemplateId();
        if (!id) return false;
        const current = JSON.stringify(appState.getData());
        const saved = this._lastSaved[id];
        return saved !== undefined && current !== saved;
      },

      /**
       * Stub: load document from "storage". In real app would fetch from API.
       */
      load(templateId) {
        const saved = this._lastSaved[templateId];
        if (saved) {
          try {
            const data = JSON.parse(saved);
            Object.keys(data).forEach(k => appState.setField(k, data[k]));
          } catch (e) {
            console.warn('DocumentManager.load parse error', e);
          }
        }
      },

    /**
     * Stub: persist current document. In real app would POST to API.
     */
      save() {
        const id = appState.getCurrentTemplateId();
        if (!id) return Promise.resolve(false);
        const data = appState.getData();
        this._lastSaved[id] = JSON.stringify(data);
        return Promise.resolve(true);
      }
    };

    /* --------------------------------------------------------------------------
       EXPORT ENGINE — Print-optimized behavior and future PDF export hooks
       -------------------------------------------------------------------------- */

    /**
     * ExportEngine prepares the document for print/PDF: strips UI, applies print CSS.
     * Print CSS is already in @media print; this object allows future extensions
     * (e.g. generate PDF via browser print to PDF or external library).
     */
    const ExportEngine = {
      /**
       * Returns the current A4 preview root element for printing.
       */
      getPrintableRoot() {
        return document.getElementById('a4Preview');
      },

      /**
       * Triggers native print dialog. User can choose "Save as PDF" in dialog.
       */
      print() {
        window.print();
      },

      /**
       * Stub: future PDF blob generation (would use e.g. html2canvas + jspdf or print-to-pdf API).
       */
      toPDF() {
        return Promise.reject(new Error('PDF export not implemented in this build'));
      }
    };

    /* --------------------------------------------------------------------------
       A4 PREVIEW AUTO-SCALE — Fit A4 to viewport while preserving aspect
       -------------------------------------------------------------------------- */

    /**
     * Computes scale factor so that 210mm x 297mm fits in the preview panel
     * with padding, and applies it to .a4-container via transform.
     */
    function updateA4Scale() {
      const panel = document.querySelector('.preview-panel');
      const container = document.getElementById('a4Container');
      if (!panel || !container) return;
      const panelRect = panel.getBoundingClientRect();
      const padding = 40 * 2;
      const maxW = panelRect.width - padding;
      const maxH = panelRect.height - padding;
      const a4W = 210 * 3.78;
      const a4H = 297 * 3.78;
      const scaleX = maxW / a4W;
      const scaleY = maxH / a4H;
      const scale = Math.min(1, scaleX, scaleY);
      container.style.transform = `scale(${scale})`;
    }

    /* --------------------------------------------------------------------------
       ACCESSIBILITY — Focus trap in modal, aria attributes
       -------------------------------------------------------------------------- */

    function trapFocusInModal(modalEl) {
      if (!modalEl) return;
      const focusables = modalEl.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      modalEl.addEventListener('keydown', function onKey(e) {
        if (e.key !== 'Tab') return;
        if (e.shiftKey) {
          if (document.activeElement === first) {
            e.preventDefault();
            last && last.focus();
          }
        } else {
          if (document.activeElement === last) {
            e.preventDefault();
            first && first.focus();
          }
        }
      });
    }

    document.getElementById('signatureModal')?.addEventListener('transitionend', function (e) {
      if (e.target === this && this.classList.contains('visible')) {
        const firstBtn = this.querySelector('button');
        if (firstBtn) firstBtn.focus();
      }
    });

    /* --------------------------------------------------------------------------
       KEYBOARD SHORTCUTS — Power user navigation and actions
       -------------------------------------------------------------------------- */

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'p') {
        e.preventDefault();
        document.getElementById('btnExport')?.click();
      }
      if (e.ctrlKey && e.key === 's') {
        e.preventDefault();
        document.getElementById('btnSave')?.click();
      }
      if (e.key === 'Escape') {
        const modal = document.getElementById('signatureModal');
        if (modal && modal.classList.contains('visible')) {
          modal.classList.remove('visible');
        }
      }
    });

    /* --------------------------------------------------------------------------
       INIT — Bootstrap app and real-time subscription
       -------------------------------------------------------------------------- */

    function init() {
      renderSidebar();
      initSignaturePad();
      const firstTemplate = DATABASE.templates[0];
      if (firstTemplate) selectDocument(firstTemplate.id);
      appState.subscribe(() => renderPreview());
      updateA4Scale();
      window.addEventListener('resize', updateA4Scale);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    /*
     * ==========================================================================
     * FILE STRUCTURE AND MODULE INDEX (for maintainability)
     * ==========================================================================
     *
     * 1. DOCUMENT HEAD & STYLES
     *    - :root variables (Design System Spatial 2026)
     *    - Layout: .workspace, .sidebar, .editor-panel, .preview-panel
     *    - Sidebar: folder groups, .doc-item, status indicators
     *    - Editor: .field-group, .field-input, .field-textarea, .field-select
     *    - UI Kit: .btn, .checkbox-wrap, .progress-wrap, [data-tooltip]
     *    - Preview: .a4-container, .a4-inner, .signature-zone
     *    - Modals: .modal-overlay, .modal, signature pad container
     *    - @media print: hide UI, show only A4
     *    - Micro-interactions, scrollbar, focus-visible, reduced-motion
     *    - Loading overlay, toast, [data-theme="light"]
     *
     * 2. HTML BODY
     *    - .workspace > .sidebar (#sidebarNav) + .editor-panel + .preview-panel
     *    - .editor-header, #editorDocName, #editorScroll, .editor-actions
     *    - #a4Container, #a4Preview
     *    - #loadingOverlay, #toastContainer
     *    - #signatureModal, #signaturePad, #btnClearSign, #btnApplySign
     *
     * 3. JAVASCRIPT — GLOBALS & DATABASE
     *    - DATABASE.categories (4), DATABASE.templates (15)
     *    - DEFAULT_VALUES, TEMPLATE_FIELD_META, applyDefaultsForTemplate
     *
     * 4. NUMBER TO WORDS & VALIDATION
     *    - numberToWordsHundreds, numberToWords, numberToWordsExtended
     *    - validateField, validateCurrentDocument
     *    - applyValidationErrors, clearValidationErrors
     *    - ERROR_MESSAGES, FIELD_VALIDATORS
     *
     * 5. STATE & PERSISTENCE
     *    - State class, appState
     *    - getTemplateById, getTemplatesByCategory, getCategoryById
     *    - loadDocumentFromStorage, saveDocumentToStorage, debouncedSaveToStorage
     *    - DocumentManager, History, createStateSnapshot, restoreStateSnapshot
     *
     * 6. PREVIEW & LAYOUTS
     *    - PREVIEW_LAYOUTS (nda, service, founders, resolution, employment, offer,
     *      termination, ip, lease, sales, act, poa, loan, receipt, gift)
     *    - getA4DocumentHeader, getA4DocumentFooter, renderSign, renderPreview
     *    - DocumentBuilder
     *
     * 7. SIGNATURE PAD
     *    - initSignaturePad, clearSignaturePad, getSignatureDataUrl
     *    - Smooth ink: velocity-based line width
     *
     * 8. SIDEBAR & EDITOR
     *    - renderSidebar, selectDocument, renderEditorForm, FormRenderer
     *    - escapeHtml, NUMBER_TO_WORDS_KEYS, subscription (auto words + preview + save)
     *
     * 9. MODALS & ACTIONS
     *    - Signature modal: open, clear, apply, close; click on signature block
     *    - btnExport (print), btnSave (validate + DocumentManager.save)
     *
     * 10. EXPORT, SCALE, KEYBOARD, A11Y
     *    - ExportEngine, updateA4Scale, resize listener
     *    - Ctrl+P, Ctrl+S, Escape (close modal)
     *    - trapFocusInModal, focus on modal open
     *
     * 11. CONSTANTS & CONFIG
     *    - LEGAL_CLAUSES, VERBOSE_CLAUSES, CONFIG, CONFIG_ADVANCED
     *    - I18N, LOCALIZED_STRINGS, HELP_CONTENT, TIPS_AND_NOTES
     *    - TEMPLATE_SECTIONS, DOCUMENT_TYPE_META, GLOSSARY
     *    - LEGAL_REFERENCES, PRINT_PRESETS, EXPORT_PRESETS
     *    - LOCALE, VALIDATION_RULES, LAYOUT_FRAGMENTS
     *    - DEFAULT_LEGAL_CONTENT, RICH_TEXT_SAMPLES, EXAMPLE_DOCUMENTS
     *    - SAMPLE_LEGAL_TEXT, DOCUMENT_STATUS, getDocumentStatus
     *
     * 12. UTILITIES
     *    - formatDateLocal, debounce, throttle, shallowClone, mergeData
     *    - showLoading, hideLoading, showToast
     *
     * 13. INIT
     *    - init(): renderSidebar, initSignaturePad, selectDocument(first),
     *      appState.subscribe, updateA4Scale, resize
     *
     * PREVIEW LAYOUTS INDEX (template id -> layout key -> main fields)
     * nda -> party1Name, party2Name, confidentialScope, exclusions, termMonths, party1Sign, party2Sign
     * service-agreement -> customerName, executorName, serviceSubject, priceAmount, priceWords, deadline, customerSign, executorSign
     * founders-agreement -> founder1, founder2, companyName, share1, share2, authorizedCapital, management, profitDistribution
     * board-resolution -> companyName, resolutionDate, agenda, resolutionText, chairmanName, secretaryName, chairmanSign
     * employment-contract -> employerName, employeeName, position, startDate, salary, salaryWords, workSchedule, vacationDays
     * offer-letter -> companyName, candidateName, position, salary, startDate, validUntil, benefits, hrSign
     * termination-notice -> employerName, employeeName, terminationDate, reason, noticeText, employerSign
     * ip-assignment -> employeeName, employerName, ipSubject, assignmentDate, consideration, employeeSign, employerSign
     * lease-agreement -> landlordName, tenantName, propertyAddress, propertyDetails, rentAmount, rentWords, leaseStart, leaseEnd
     * sales-contract -> sellerName, buyerName, propertyAddress, cadastralNumber, priceAmount, priceWords, transferDate
     * act-of-transfer -> party1Name, party2Name, subjectMatter, actDate, condition, party1Sign, party2Sign
     * power-of-attorney -> principalName, principalPassport, agentName, authorityScope, validFrom, validUntil, principalSign
     * loan-agreement -> lenderName, borrowerName, amount, amountWords, interestRate, repaymentDate, lenderSign, borrowerSign
     * debt-receipt -> payerName, payeeName, amount, amountWords, receiptDate, purpose, payeeSign
     * gift-deed -> donorName, doneeName, giftSubject, giftDate, donorSign, doneeSign
     *
     * DESIGN TOKENS (CSS variables used across the file)
     * --bg-base, --bg-elevated, --bg-glass, --glass-border, --text-primary, --text-secondary,
     * --text-muted, --accent, --accent-hover, --accent-subtle, --success, --warning, --danger,
     * --sidebar-width (320px), --editor-width (450px), --radius-sm/md/lg, --blur-sidebar (40px),
     * --transition-fast/smooth/spring, --shadow-soft.
     *
     * EVENT FLOW: User selects doc -> selectDocument -> setCurrentTemplate -> load from storage
     * or applyDefaults -> renderEditorForm -> renderPreview. User edits -> input/change ->
     * setField -> subscribers (numberToWords, renderPreview, debouncedSaveToStorage).
     * User signs -> modal open -> draw -> apply -> setField(signatureKey, dataUrl) -> renderPreview.
     * User save -> validateCurrentDocument -> applyValidationErrors or DocumentManager.save.
     * User export -> window.print() -> @media print shows only A4.
     * ==========================================================================
     */
  </script>
</body>
</html>
