<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПАКЕТ УСЛУГ ММБ | 2026 Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sidebar-bg: #ffffff;
            --workspace-bg: #f8fafc;
            --accent: #111827;
            --border: #e5e7eb;
            --text-main: #111827;
            --text-muted: #6b7280;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--sidebar-bg);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 300px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            background: #fff;
            z-index: 100;
        }

        .brand {
            padding: 32px 24px;
            border-bottom: 1px solid var(--border);
        }
        .brand h1 { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); }
        .brand p { font-size: 20px; font-weight: 700; margin-top: 4px; }

        .nav-container { flex: 1; overflow-y: auto; padding: 20px 12px; }

        .folder { margin-bottom: 10px; }
        .folder-header {
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s;
            font-weight: 600;
            font-size: 14px;
        }
        .folder-header:hover { background: var(--workspace-bg); }
        
        .folder-content {
            display: none;
            padding-left: 12px;
            margin-top: 4px;
        }
        .folder.open .folder-content { display: block; }
        .folder.open .chevron { transform: rotate(90deg); }

        .doc-item {
            padding: 8px 12px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
            margin-bottom: 2px;
            transition: 0.2s;
        }
        .doc-item:hover { background: var(--workspace-bg); color: var(--text-main); }
        .doc-item.active { background: var(--accent); color: #fff; font-weight: 500; }

        /* --- WORKSPACE --- */
        .workspace {
            flex: 1;
            display: flex;
            background: var(--workspace-bg);
            position: relative; /* Важно для позиционирования экрана приветствия */
        }

        /* Левая часть воркспейса (Поля ввода) */
        .editor {
            width: 400px;
            background: #fff;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 40px;
            overflow-y: auto;
            z-index: 10;
        }

        .editor h2 { font-size: 22px; margin-bottom: 30px; }

        .input-group { margin-bottom: 24px; }
        .input-group label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
        .input-group input, .input-group textarea {
            width: 100%; border: none; border-bottom: 1px solid var(--border);
            padding: 10px 0; font-family: inherit; font-size: 15px; outline: none; transition: 0.3s;
        }
        .input-group input:focus { border-bottom-color: var(--accent); }

        /* Правая часть воркспейса (Лист А4) */
        .preview {
            flex: 1;
            padding: 60px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            background: #f1f5f9;
        }

        .a4 {
            width: 210mm;
            min-height: 297mm;
            background: #fff;
            padding: 25mm 20mm;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            font-family: 'Lora', serif;
            line-height: 1.6;
            color: #1a1a1a;
        }

        /* ЭКРАН ПРИВЕТСТВИЯ — теперь он перекрывает только Workspace */
        .welcome {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 50;
            text-align: center;
            padding: 40px;
        }
        .welcome h1 { font-size: 32px; margin-bottom: 16px; }
        .welcome p { color: var(--text-muted); max-width: 400px; }

        /* Кнопка печати */
        .btn-print {
            position: fixed; bottom: 30px; right: 30px;
            background: var(--accent); color: #fff; border: none;
            padding: 16px 32px; border-radius: 50px; font-weight: 600;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            z-index: 100; transition: 0.3s;
        }
        .btn-print:hover { transform: translateY(-2px); }

        .signature-area {
            margin-top: 30px;
            padding: 20px;
            border: 1px dashed var(--border);
            border-radius: 12px;
        }
        canvas { width: 100%; height: 100px; background: #fafafa; border-radius: 4px; cursor: crosshair; }

        @media print {
            .sidebar, .editor, .btn-print, .welcome { display: none !important; }
            body { background: #fff; }
            .workspace, .preview { padding: 0; margin: 0; display: block; }
            .a4 { box-shadow: none; width: 100%; margin: 0; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <h1>Система документов</h1>
            <p>Пакет услуг ММБ</p>
        </div>
        <div class="nav-container" id="menu">
            </div>
    </aside>

    <main class="workspace">
        <div class="welcome" id="welcome">
            <h1>Добро пожаловать</h1>
            <p>Выберите документ из папки слева, чтобы начать работу.</p>
        </div>

        <section class="editor">
            <h2 id="doc-title">Настройка</h2>
            <div id="fields"></div>
            
            <div class="signature-area">
                <label style="font-size: 11px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 10px;">ПОДПИСЬ МЫШЬЮ</label>
                <canvas id="pad"></canvas>
                <button onclick="clearPad()" style="background:none; border:none; color:red; font-size:10px; cursor:pointer; margin-top:5px;">Очистить</button>
            </div>
        </section>

        <section class="preview">
            <div class="a4" id="a4-content">
                </div>
        </section>
    </main>

    <button class="btn-print" id="print-btn" style="display:none" onclick="window.print()">Распечатать PDF</button>

    <script>
        const data = [
            {
                folder: "Бизнес услуги",
                docs: [
                    { id: 'c1', name: 'Договор ММБ', fields: ['Город', 'Дата', 'ФИО Заказчика', 'Сумма'], template: (d, s) => `
                        <div style="text-align:center; font-weight:700; margin-bottom:40px;">ДОГОВОР ОКАЗАНИЯ УСЛУГ</div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:30px;">
                            <span>г. ${d['Город'] || '_______'}</span>
                            <span>${d['Дата'] || '«___» _______ 2026 г.'}</span>
                        </div>
                        <p>Заказчик <b>${d['ФИО Заказчика'] || '________________'}</b> поручает Исполнителю выполнение работ согласно Пакету ММБ.</p>
                        <p>Стоимость услуг составляет ${d['Сумма'] || '0'} руб.</p>
                        <div style="margin-top:100px; display:flex; justify-content:flex-end;">
                            <div style="text-align:center; border-top:1px solid #000; min-width:200px;">
                                ${s ? `<img src="${s}" style="height:60px; display:block; margin: -50px auto 0;">` : ''}
                                <small>Подпись Заказчика</small>
                            </div>
                        </div>
                    `}
                ]
            },
            {
                folder: "Личные документы",
                docs: [
                    { id: 'r1', name: 'Расписка', fields: ['От кого', 'Кому', 'Сумма слов'], template: (d, s) => `
                        <div style="text-align:center; font-weight:700; margin-bottom:40px;">РАСПИСКА</div>
                        <p>Я, ${d['От кого'] || '_______'}, подтверждаю получение денежных средств от ${d['Кому'] || '_______'}.</p>
                        <p>Сумма: ${d['Сумма слов'] || '_______'}.</p>
                        <div style="margin-top:100px;">Подпись: ${s ? `<img src="${s}" style="height:50px;">` : '___________'}</div>
                    `}
                ]
            }
        ];

        let currentDoc = null;
        let inputs = {};
        let sigImg = null;

        // Инициализация меню
        const menu = document.getElementById('menu');
        data.forEach(cat => {
            const f = document.createElement('div');
            f.className = 'folder';
            f.innerHTML = `
                <div class="folder-header" onclick="this.parentElement.classList.toggle('open')">
                    <span>📁 ${cat.folder}</span>
                    <span class="chevron" style="font-size:10px;">▶</span>
                </div>
                <div class="folder-content">
                    ${cat.docs.map(doc => `<div class="doc-item" onclick="loadDoc('${doc.id}')">${doc.name}</div>`).join('')}
                </div>
            `;
            menu.appendChild(f);
        });

        function loadDoc(id) {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('print-btn').style.display = 'block';
            
            // Ищем конфиг документа
            data.forEach(cat => {
                const found = cat.docs.find(d => d.id === id);
                if(found) currentDoc = found;
            });

            document.getElementById('doc-title').innerText = currentDoc.name;
            const fDiv = document.getElementById('fields');
            fDiv.innerHTML = '';
            inputs = {};
            
            currentDoc.fields.forEach(f => {
                const group = document.createElement('div');
                group.className = 'input-group';
                group.innerHTML = `<label>${f}</label><input type="text" oninput="update('${f}', this.value)">`;
                fDiv.appendChild(group);
            });
            
            render();
        }

        function update(key, val) {
            inputs[key] = val;
            render();
        }

        function render() {
            if(!currentDoc) return;
            document.getElementById('a4-content').innerHTML = currentDoc.template(inputs, sigImg);
        }

        // Подпись
        const canvas = document.getElementById('pad');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        canvas.width = canvas.offsetWidth;
        canvas.height = 100;

        canvas.onmousedown = () => drawing = true;
        canvas.onmouseup = () => { drawing = false; ctx.beginPath(); sigImg = canvas.toDataURL(); render(); };
        canvas.onmousemove = (e) => {
            if(!drawing) return;
            ctx.lineWidth = 2;
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
        };

        function clearPad() { ctx.clearRect(0,0,canvas.width,canvas.height); sigImg = null; render(); }
    </script>
</body>
</html>
