<!--
Интерпретируя ваш follow-up как просьбу реализовать "код для Марио" — имея в виду минимальную игру или анимацию в стиле Mario прямо в index.html, но согласно первоначальному требованию использовать только один файл и Vanilla JS.
Пример ниже: игра "Марио" (super-basic runner demo in JS) на canvas. Просто вставьте этот фрагмент внутрь index.html. 
-->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Mini Mario Runner</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    body {
      margin: 0;
      background: #F8FAFC;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Inter, sans-serif;
    }
    #game {
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.05);
      background: #FFFFFFCC;
      backdrop-filter: blur(8px);
      border: 2px solid #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 24px;
    }
    canvas {
      background: linear-gradient(#a2e3fa 80%, #63ceff 100%);
      display: block;
      border-radius: 20px;
      margin-top: 12px;
      box-shadow: 0 6px 24px rgba(17,24,39,0.08);
    }
    h1 {
      margin: 0;
      color: #111827;
      font-family: 'Lora', serif;
      font-size: 2rem;
      letter-spacing: 0.03em;
    }
    p {
      font-size: 1rem;
      color: #888;
      margin: 0;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div id="game">
    <h1>Mini Mario Runner</h1>
    <p>Пробел — прыгнуть</p>
    <canvas id="mario" width="480" height="240"></canvas>
    <p><small>Demo</small></p>
  </div>
  <script>
    // Простая "раннер" игра: Марио бежит, перепрыгивает препятствия
    const canvas = document.getElementById('mario');
    const ctx = canvas.getContext('2d');

    // Mario params
    let mario = {
      x: 48,
      y: 180,
      width: 32,
      height: 32,
      vy: 0,
      onGround: true
    };

    // Platform params
    const groundY = 212;
    // Obstacle params
    let obstacles = [
      {x: 480, width: 18, height: 38, speed: 3}
    ];
    let score = 0;
    let gameOver = false;

    document.addEventListener('keydown', e=>{
      if(e.code === "Space" && mario.onGround && !gameOver) {
        mario.vy = -11.5;
        mario.onGround = false;
      }
      if(e.code === "Enter" && gameOver){
        resetGame();
      }
    });

    function drawMario(){
      // simple pixel-art "Mario"
      ctx.save();
      ctx.translate(mario.x, mario.y);
      ctx.fillStyle = "#FBAA19"; // face
      ctx.fillRect(8,1,14,8);
      ctx.fillStyle = "#3366AA"; // body
      ctx.fillRect(10,13,12,16);
      ctx.fillStyle = "#E06926"; // hat
      ctx.fillRect(7,0,17,6);
      ctx.fillStyle = "#865117"; // boots
      ctx.fillRect(10,27,5,5);
      ctx.fillRect(17,27,5,5);
      ctx.fillStyle = "#fff"; // gloves
      ctx.fillRect(7,18,6,5);
      ctx.fillRect(20,18,5,5);
      ctx.restore();
    }

    function drawObstacle(ob) {
      ctx.save();
      ctx.fillStyle="#228B22";
      ctx.fillRect(ob.x, groundY-ob.height, ob.width, ob.height);
      ctx.fillStyle="#387d18";
      ctx.fillRect(ob.x-2, groundY-ob.height-6, ob.width+4, 8); // Top bushy part
      ctx.restore();
    }

    function drawGround() {
      ctx.save();
      ctx.fillStyle="#d1a469";
      ctx.fillRect(0, groundY, 480, 28);
      // "Dirt" details
      ctx.fillStyle = "#cc9257";
      for(let i=0;i<24;i++){
        ctx.fillRect(i*20 + (i%4)*4, groundY+18, 8,4);
      }
      ctx.restore();
    }

    function physics(){
      mario.y += mario.vy;
      mario.vy += 0.7;
      if(mario.y >= groundY-mario.height){
        mario.y = groundY-mario.height;
        mario.vy = 0;
        mario.onGround = true;
      }
      // Collision with obstacles
      for(const ob of obstacles){
        if(
          mario.x + mario.width > ob.x &&
          mario.x < ob.x + ob.width &&
          mario.y + mario.height > groundY-ob.height
        ){
          gameOver = true;
        }
      }
    }

    function updateObstacles(){
      for(const ob of obstacles){
        ob.x -= ob.speed;
      }
      // Increase score and add obstacle if needed
      if(obstacles[0].x + obstacles[0].width < 0){
        obstacles.shift();
        score++;
        const gap = 120 + Math.floor(Math.random()*60);
        obstacles.push({
          x: 480 + gap,
          width: 16+Math.floor(Math.random()*10),
          height: 32+Math.floor(Math.random()*16),
          speed: 3 + Math.min(2, Math.floor(score/5))
        });
      }
    }

    function render(){
      ctx.clearRect(0, 0, 480, 240);
      drawGround();
      for(const ob of obstacles){
        drawObstacle(ob);
      }
      drawMario();
      ctx.save();
      ctx.font = "bold 18px Inter, sans-serif";
      ctx.fillStyle = "#111827";
      ctx.fillText("Счёт: "+score, 12, 28);
      if(gameOver){
        ctx.font = "bold 40px Lora, serif";
        ctx.fillStyle="#111827";
        ctx.textAlign="center";
        ctx.fillText("Game over!", 240, 128);
        ctx.font = "bold 22px Inter,sans-serif";
        ctx.fillStyle = "#E06926";
        ctx.fillText("Enter — начать заново", 240, 162);
        ctx.textAlign="left";
      }
      ctx.restore();
    }

    function resetGame(){
      score = 0;
      obstacles = [
        {x: 480, width: 18, height: 38, speed: 3}
      ];
      mario.y = 180;
      mario.vy = 0;
      mario.onGround = true;
      gameOver = false;
    }

    function step(){
      if(!gameOver){
        physics();
        updateObstacles();
        render();
        requestAnimationFrame(step);
      }else{
        render();
      }
    }

    // Font loading for Inter/Lora
    (function(){
      const style = document.createElement("style");
      style.textContent = `
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lora:wght@700&display=swap');
      `;
      document.head.appendChild(style);
    })();

    render();
    setTimeout(()=>{step();}, 900);
  </script>
</body>
</html>
