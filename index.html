<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пакет услуг ММБ</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fcfcfd;
            --accent: #000000;
            --secondary: #64748b;
            --card: #ffffff;
            --border: #f1f5f9;
            --glass: rgba(255, 255, 255, 0.7);
        }

        body {
            margin: 0; font-family: 'Manrope', sans-serif;
            background-color: var(--bg); color: var(--accent);
            display: flex; height: 100vh;
        }

        /* SIDEBAR (Minimalist) */
        .sidebar {
            width: 300px; border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 40px 20px;
            background: var(--glass); backdrop-filter: blur(10px);
        }

        .brand { font-weight: 700; font-size: 1.2rem; margin-bottom: 40px; letter-spacing: -0.5px; }
        .brand span { color: var(--secondary); font-weight: 300; }

        .folder { margin-bottom: 15px; }
        .folder-title {
            font-weight: 600; font-size: 0.9rem; color: var(--secondary);
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
            cursor: pointer;
        }
        .folder-content { padding-left: 15px; border-left: 1px solid var(--border); }
        
        .doc-link {
            padding: 8px 0; cursor: pointer; font-size: 0.95rem;
            transition: 0.2s; display: block; color: var(--accent); opacity: 0.6;
            text-decoration: none;
        }
        .doc-link:hover, .doc-link.active { opacity: 1; padding-left: 5px; }

        /* WORKSPACE */
        .workspace { flex: 1; display: grid; grid-template-columns: 380px 1fr; gap: 0; }

        .editor {
            padding: 40px; border-right: 1px solid var(--border);
            overflow-y: auto; background: #fff;
        }
        .editor h2 { font-size: 1.5rem; margin-bottom: 30px; font-weight: 700; }

        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; color: var(--secondary); }
        input, textarea {
            width: 100%; border: none; border-bottom: 1px solid var(--border);
            padding: 10px 0; font-family: inherit; font-size: 1rem;
            transition: 0.3s; outline: none; background: transparent;
        }
        input:focus { border-bottom-color: var(--accent); }

        /* PREVIEW (A4 Minimalist) */
        .preview {
            background: #f8fafc; padding: 60px;
            display: flex; justify-content: center; overflow-y: auto;
        }
        .a4-page {
            width: 210mm; height: 297mm; background: white;
            padding: 25mm; box-shadow: 0 40px 100px rgba(0,0,0,0.03);
            font-family: 'Lora', serif; line-height: 1.7; color: #1a1a1a;
            position: relative; box-sizing: border-box;
        }

        .btn-print {
            position: fixed; bottom: 40px; right: 40px;
            background: #000; color: #fff; border: none;
            padding: 15px 30px; border-radius: 40px; font-weight: 600;
            cursor: pointer; transition: 0.3s; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .btn-print:hover { transform: translateY(-5px); }

        .sig-canvas { border-bottom: 1px solid #eee; width: 100%; height: 80px; margin-top: 10px; }

        @media print {
            .sidebar, .editor, .btn-print { display: none; }
            .workspace { display: block; }
            .preview { padding: 0; background: white; }
            .a4-page { box-shadow: none; margin: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">ПАКЕТ УСЛУГ <span>ММБ</span></div>
        
        <div class="folder">
            <div class="folder-title">📁 БИЗНЕС</div>
            <div class="folder-content">
                <div class="doc-link active" onclick="loadDoc('contract')">Договор услуг</div>
                <div class="doc-link" onclick="loadDoc('nda')">Соглашение NDA</div>
            </div>
        </div>

        <div class="folder">
            <div class="folder-title">📁 ЧАСТНОЕ</div>
            <div class="folder-content">
                <div class="doc-link" onclick="loadDoc('receipt')">Расписка</div>
                <div class="doc-link" onclick="loadDoc('gift')">Договор дарения</div>
            </div>
        </div>
    </div>

    <div class="workspace">
        <div class="editor">
            <h2 id="doc-name">Договор услуг</h2>
            <div id="fields"></div>
            
            <div class="input-group" style="margin-top:40px">
                <label>Ваша подпись (мышью)</label>
                <canvas id="sig" class="sig-canvas"></canvas>
                <button onclick="clearSig()" style="background:none; border:none; color:red; font-size:0.7rem; cursor:pointer; padding:5px 0">Очистить</button>
            </div>
        </div>

        <div class="preview">
            <div class="a4-page" id="page"></div>
        </div>
    </div>

    <button class="btn-print" onclick="window.print()">Распечатать документ</button>

    <script>
        const docs = {
            contract: {
                title: 'Договор оказания услуг',
                fields: [{id:'name', label:'Исполнитель'}, {id:'client', label:'Заказчик'}, {id:'sum', label:'Сумма'}],
                template: (d, s) => `<h3>Договор</h3><p>Исполнитель ${d.name || '___'} обязуется оказать услуги Заказчику ${d.client || '___'}.</p><p>Стоимость: ${d.sum || '0'} руб.</p><div style="margin-top:100px">Подпись: <img src="${s}" style="height:50px"></div>`
            },
            receipt: {
                title: 'Расписка',
                fields: [{id:'name', label:'ФИО получателя'}, {id:'sum', label:'Сумма цифрами'}],
                template: (d, s) => `<h3>Расписка</h3><p>Я, ${d.name || '___'}, получил денежные средства в размере ${d.sum || '0'} руб.</p><div style="margin-top:100px">Подпись: <img src="${s}" style="height:50px"></div>`
            }
        };

        let currentDoc = 'contract';
        let data = {};
        let signature = '';

        function loadDoc(id) {
            currentDoc = id;
            document.getElementById('doc-name').innerText = docs[id].title;
            const container = document.getElementById('fields');
            container.innerHTML = '';
            docs[id].fields.forEach(f => {
                container.innerHTML += `<div class="input-group"><label>${f.label}</label><input oninput="update('${f.id}', this.value)"></div>`;
            });
            updateView();
        }

        function update(key, val) {
            data[key] = val;
            updateView();
        }

        function updateView() {
            document.getElementById('page').innerHTML = docs[currentDoc].template(data, signature);
        }

        // Подпись
        const canvas = document.getElementById('sig');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        canvas.onmousedown = () => drawing = true;
        canvas.onmouseup = () => { drawing = false; ctx.beginPath(); signature = canvas.toDataURL(); updateView(); };
        canvas.onmousemove = (e) => {
            if(!drawing) return;
            ctx.lineWidth = 2; ctx.lineCap = 'round';
            ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke();
        };

        function clearSig() { ctx.clearRect(0,0,canvas.width,canvas.height); signature = ''; updateView(); }

        loadDoc('contract');
    </script>
</body>
</html>
