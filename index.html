<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProDoc Workspace - Профессиональный генератор документов</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Merriweather:ital@0;1&display=swap" rel="stylesheet">
    <style>
        /* БАЗОВЫЕ НАСТРОЙКИ И ПЕРЕМЕННЫЕ */
        :root {
            --bg-color: #f3f4f6;
            --sidebar-bg: #111827;
            --sidebar-text: #9ca3af;
            --sidebar-hover: #ffffff;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --doc-bg: #ffffff;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --sidebar-bg: #020617;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --doc-bg: #f8fafc; /* Документ остается белым даже в темной теме для реализма */
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        /* БОКОВОЕ МЕНЮ (SIDEBAR) */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            transition: 0.3s;
            z-index: 10;
        }
        .logo { font-size: 1.5rem; font-weight: 800; color: white; padding: 0 20px 20px; border-bottom: 1px solid #374151; margin-bottom: 20px; letter-spacing: 1px; }
        .logo span { color: var(--accent); }
        .menu-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        .menu-item:hover, .menu-item.active { background-color: #1f2937; color: var(--sidebar-hover); border-left: 4px solid var(--accent); }
        .theme-toggle { margin-top: auto; padding: 20px; text-align: center; cursor: pointer; color: white; font-weight: 600; background: rgba(255,255,255,0.05); }

        /* ОСНОВНАЯ РАБОЧАЯ ЗОНА */
        .workspace { flex: 1; display: flex; gap: 20px; padding: 20px; overflow-y: auto; }

        /* ПАНЕЛЬ ИНСТРУМЕНТОВ (РЕДАКТОР) */
        .tools-panel {
            flex: 0 0 400px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow-y: auto;
            height: calc(100% - 50px);
        }
        .tools-panel::-webkit-scrollbar { width: 6px; }
        .tools-panel::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        h2 { margin-top: 0; font-size: 1.2rem; color: var(--text-main); border-bottom: 2px solid var(--border); padding-bottom: 10px;}
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px;}
        input, textarea {
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
            background: var(--bg-color); color: var(--text-main); font-family: inherit; font-size: 0.95rem; box-sizing: border-box; transition: 0.2s;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }

        /* БЛОК ПОДПИСИ (CANVAS) */
        .signature-box { border: 2px dashed var(--border); border-radius: 8px; background: var(--bg-color); margin-bottom: 15px; text-align: center; overflow: hidden; }
        canvas { width: 100%; height: 120px; cursor: crosshair; touch-action: none; display: block; }
        .clear-sig { background: #ef4444; color: white; border: none; padding: 5px 10px; font-size: 0.8rem; cursor: pointer; width: 100%; }

        button.action-btn {
            width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 10px; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3);
        }
        button.action-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }

        /* ПРЕДПРОСМОТР ДОКУМЕНТА (A4) */
        .preview-panel {
            flex: 1; display: flex; justify-content: center; overflow-y: auto; padding-bottom: 40px;
        }
        .document-a4 {
            width: 210mm; min-height: 297mm; background: var(--doc-bg); color: #000;
            padding: 20mm; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            font-family: 'Merriweather', serif; /* Серифный шрифт для официальности */
            font-size: 14px; line-height: 1.6; position: relative;
        }
        
        .doc-title { text-align: center; font-size: 18px; font-weight: bold; margin: 30px 0; text-transform: uppercase; }
        .doc-right { text-align: right; margin-bottom: 40px; }
        .doc-justify { text-align: justify; }
        .sig-image { max-height: 80px; position: absolute; margin-top: -30px; }

        /* Адаптивность для телефонов */
        @media (max-width: 1000px) {
            body { flex-direction: column; overflow: auto; }
            .sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding: 10px; }
            .logo { display: none; }
            .menu-item { padding: 10px; white-space: nowrap; }
            .workspace { flex-direction: column; overflow: visible; }
            .tools-panel { flex: none; height: auto; width: 100%; box-sizing: border-box; }
            .document-a4 { width: 100%; padding: 10mm; min-height: auto; box-sizing: border-box; }
        }

        /* ПРАВИЛА ДЛЯ ПЕЧАТИ */
        @media print {
            body { background: white; }
            .sidebar, .tools-panel { display: none !important; }
            .workspace { padding: 0; display: block; }
            .preview-panel { display: block; padding: 0; }
            .document-a4 { box-shadow: none; width: 100%; margin: 0; padding: 0; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">Pro<span>Doc</span></div>
        <div class="menu-item active" onclick="switchTemplate('contract')">📄 Договор услуг</div>
        <div class="menu-item" onclick="switchTemplate('nda')">🔒 NDA (Неразглашение)</div>
        <div class="menu-item" onclick="switchTemplate('rent')">🏠 Договор аренды</div>
        <div class="menu-item" onclick="switchTemplate('receipt')">💰 Расписка</div>
        <div class="theme-toggle" onclick="toggleTheme()">🌓 Сменить тему</div>
    </div>

    <div class="workspace">
        <div class="tools-panel">
            <h2>Заполнение данных</h2>
            <div id="dynamic-fields">
                </div>
            
            <h2>Ваша подпись</h2>
            <div class="signature-box">
                <canvas id="sigCanvas"></canvas>
                <button class="clear-sig" onclick="clearSignature()">Очистить подпись</button>
            </div>

            <button class="action-btn" onclick="window.print()">🖨️ Печать / Сохранить PDF</button>
            <button class="action-btn" style="background: #10b981; margin-top: 10px;" onclick="clearAll()">🗑️ Начать заново</button>
        </div>

        <div class="preview-panel">
            <div class="document-a4" id="document-preview">
                </div>
        </div>
    </div>

    <script>
        // --- 1. БАЗА ШАБЛОНОВ ---
        // Здесь мы описываем, какие поля нужны каждому документу и как он выглядит
        const templates = {
            contract: {
                fields: [
                    { id: 'city', label: 'Город подписания', default: 'Москва' },
                    { id: 'date', label: 'Дата', type: 'date' },
                    { id: 'customer', label: 'ФИО Заказчика', default: 'Иванов Иван Иванович' },
                    { id: 'executor', label: 'ФИО Исполнителя', default: 'Петров Петр Петрович' },
                    { id: 'service', label: 'Описание услуги', type: 'textarea', default: 'разработка веб-сайта' },
                    { id: 'price', label: 'Сумма (руб)', default: '100 000' }
                ],
                render: (data, sig) => `
                    <div class="doc-title">ДОГОВОР ОКАЗАНИЯ УСЛУГ</div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                        <span>г. ${data.city || '_______'}</span>
                        <span>${data.date || '«___» _______ 202_ г.'}</span>
                    </div>
                    <p class="doc-justify">
                        Гражданин <b>${data.customer || '____________________'}</b>, именуемый в дальнейшем «Заказчик», с одной стороны, и 
                        гражданин <b>${data.executor || '____________________'}</b>, именуемый в дальнейшем «Исполнитель», с другой стороны, 
                        совместно именуемые «Стороны», заключили настоящий Договор о нижеследующем:
                    </p>
                    <p class="doc-justify">1. Исполнитель обязуется по заданию Заказчика оказать следующие услуги: <b>${data.service || '____________________'}</b>, а Заказчик обязуется оплатить эти услуги.</p>
                    <p class="doc-justify">2. Стоимость оказываемых услуг составляет <b>${data.price || '_____'}</b> рублей. Оплата производится не позднее 3 (трех) дней с момента подписания акта приемки-передачи.</p>
                    <p class="doc-justify">3. Настоящий договор составлен в двух экземплярах, имеющих одинаковую юридическую силу.</p>
                    
                    <div style="margin-top: 60px; display: flex; justify-content: space-between;">
                        <div>
                            <b>Заказчик:</b><br><br>
                            ________________ /${data.customer || 'ФИО'}/
                        </div>
                        <div>
                            <b>Исполнитель:</b><br><br>
                            ${sig ? `<img src="${sig}" class="sig-image">` : '________________'} /${data.executor || 'ФИО'}/
                        </div>
                    </div>
                `
            },
            receipt: {
                fields: [
                    { id: 'borrower', label: 'Я (ФИО кто берет)', default: '' },
                    { id: 'passport', label: 'Серия и номер паспорта', default: '' },
                    { id: 'amount', label: 'Сумма цифрами и прописью', default: '' },
                    { id: 'lender', label: 'Получил(а) от (ФИО)', default: '' },
                    { id: 'date_return', label: 'Обязуюсь вернуть до (Дата)', type: 'date' }
                ],
                render: (data, sig) => `
                    <div class="doc-title">РАСПИСКА В ПОЛУЧЕНИИ ДЕНЕЖНЫХ СРЕДСТВ</div>
                    <p class="doc-justify" style="margin-top: 40px; line-height: 2;">
                        Я, <b>${data.borrower || '_________________________________'}</b>, паспорт: <b>${data.passport || '_________________'}</b>, 
                        получил(а) от <b>${data.lender || '_________________________________'}</b> 
                        денежные средства в размере <b>${data.amount || '_________________________________'}</b>.
                    </p>
                    <p class="doc-justify" style="margin-top: 20px;">
                        Указанную сумму обязуюсь вернуть в полном объеме в срок до <b>${data.date_return || '«___» _______ 202_ г.'}</b>.
                    </p>
                    <div style="margin-top: 80px;">
                        <b>Подпись заемщика:</b> ${sig ? `<img src="${sig}" class="sig-image" style="margin-left: 20px;">` : '________________'} 
                    </div>
                `
            }
        };

        // Дублируем простые шаблоны для примера
        templates.nda = templates.contract; 
        templates.rent = templates.contract;

        // --- 2. ЛОГИКА ПРИЛОЖЕНИЯ ---
        let currentTemplate = 'contract';
        let formData = JSON.parse(localStorage.getItem('prodoc_data')) || {};
        let signatureData = localStorage.getItem('prodoc_sig') || null;

        const fieldsContainer = document.getElementById('dynamic-fields');
        const previewContainer = document.getElementById('document-preview');

        // Смена шаблона
        function switchTemplate(templateId) {
            currentTemplate = templateId;
            
            // Подсветка меню
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');

            renderForm();
            updatePreview();
        }

        // Отрисовка полей ввода
        function renderForm() {
            fieldsContainer.innerHTML = '';
            const fields = templates[currentTemplate].fields;

            fields.forEach(field => {
                const wrapper = document.createElement('div');
                wrapper.className = 'form-group';
                
                const label = document.createElement('label');
                label.innerText = field.label;
                wrapper.appendChild(label);

                let input;
                if (field.type === 'textarea') {
                    input = document.createElement('textarea');
                    input.rows = 3;
                } else {
                    input = document.createElement('input');
                    input.type = field.type || 'text';
                }

                input.id = field.id;
                // Восстанавливаем данные из памяти или ставим дефолт
                input.value = formData[field.id] || field.default || '';
                
                // Сохраняем и обновляем при каждом вводе
                input.addEventListener('input', (e) => {
                    formData[field.id] = e.target.value;
                    localStorage.setItem('prodoc_data', JSON.stringify(formData));
                    updatePreview();
                });

                wrapper.appendChild(input);
                fieldsContainer.appendChild(wrapper);
            });
        }

        // Обновление листа А4
        function updatePreview() {
            previewContainer.innerHTML = templates[currentTemplate].render(formData, signatureData);
        }

        // Очистка всего
        function clearAll() {
            if(confirm('Точно удалить все введенные данные?')) {
                formData = {};
                signatureData = null;
                localStorage.removeItem('prodoc_data');
                clearSignature();
                renderForm();
                updatePreview();
            }
        }

        // Темная тема
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        // --- 3. ЛОГИКА РИСОВАНИЯ ПОДПИСИ (CANVAS) ---
        const canvas = document.getElementById('sigCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        // Настройка размера холста
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000080'; // Цвет синей ручки
            if(signatureData) {
                let img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0);
                img.src = signatureData;
            }
        }
        window.addEventListener('resize', resizeCanvas);

        // Функции рисования
        function startPosition(e) { isDrawing = true; draw(e); }
        function endPosition() { 
            isDrawing = false; 
            ctx.beginPath(); 
            // Сохраняем подпись после отпускания мыши
            signatureData = canvas.toDataURL();
            localStorage.setItem('prodoc_sig', signatureData);
            updatePreview();
        }
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault(); // Запрет скролла на телефоне при рисовании
            
            // Получаем координаты для мыши или пальца
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            ctx.lineTo(clientX - rect.left, clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(clientX - rect.left, clientY - rect.top);
        }

        // События мыши
        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseleave', () => { if(isDrawing) endPosition(); });

        // События тачскрина (для телефонов)
        canvas.addEventListener('touchstart', startPosition, {passive: false});
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, {passive: false});

        function clearSignature() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            signatureData = null;
            localStorage.removeItem('prodoc_sig');
            updatePreview();
        }

        // Запуск при старте
        setTimeout(() => {
            renderForm();
            updatePreview();
            resizeCanvas();
        }, 100);

    </script>
</body>
</html>
